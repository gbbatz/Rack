    --paper:#E9E5DC; --card:#FBFAF6; --ink:#1B1A17; --soft:#6B675E;
    --faint:#9A968C; --line:#D7D1C5; --accent:#7A2E2E;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:22px 0 16px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .word{font-family:var(--serif);font-size:23px;letter-spacing:.5px;line-height:1;}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:3px;}
  .hbtns{display:flex;gap:8px;}
  .ghost{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer;}
  .ghost:hover{border-color:var(--ink);}
  .tabs{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap;}
  .tab{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--faint);background:none;border:none;
    border-bottom:2px solid transparent;padding:6px 10px 9px;cursor:pointer;}
  .tab.on{font-weight:700;color:var(--ink);border-bottom-color:var(--accent);}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .controls{display:flex;gap:10px;align-items:center;margin:16px 0 4px;flex-wrap:wrap;}
  .searchbox{position:relative;flex:1 1 220px;min-width:180px;}
  .searchbox span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;}
  input,textarea,select{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:5px;padding:9px 10px;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--ink);}
  #search{padding-left:28px;background:var(--card);}
  .add{font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:var(--ink);border:none;
    border-radius:5px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
  .filt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .seg{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:5px 9px;
    border-radius:4px;cursor:pointer;color:var(--soft);background:transparent;border:1px solid var(--line);}
  .seg.on{color:#fff;}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;}
  .tlabel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-right:2px;}
  .chip{font-family:var(--mono);font-size:11px;color:var(--soft);background:#fff;border:1px solid var(--line);
    border-radius:3px;padding:2px 8px;cursor:pointer;}
  .chip.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .grid{display:grid;gap:14px;margin-top:22px;}
  .grid.pieces{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
  .grid.brands{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;
    transition:transform .14s ease,box-shadow .14s ease;}
  .rcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px -16px #1b1a1755;}
  .thumb{position:relative;height:150px;background:#EFEBE2;border-bottom:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.3;}
  .price{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:12px;color:var(--ink);
    background:#FBFAF6E6;border:1px solid var(--line);border-radius:4px;padding:2px 7px;}
  .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .toprow{display:flex;justify-content:space-between;gap:8px;}
  .name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25;}
  .bname{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.2;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .editb{flex-shrink:0;border:none;background:none;cursor:pointer;color:var(--faint);font-size:15px;}
  .tags{display:flex;flex-wrap:wrap;gap:4px;}
  .ttag{font-family:var(--mono);font-size:10px;color:var(--soft);background:#fff;border:1px solid var(--line);border-radius:3px;padding:1px 5px;}
  .notes{font-size:12px;color:var(--soft);line-height:1.4;}
  .foot{display:flex;flex-direction:column;gap:7px;margin-top:auto;padding-top:4px;}
  .footrow{display:flex;justify-content:space-between;align-items:center;}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:.3px;text-transform:uppercase;border-radius:3px;padding:1px 5px;border:1px solid;}
  .badgebtn{border:none;background:none;padding:0;cursor:pointer;}
  .openl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);text-decoration:none;}
  .openl:hover{opacity:.7;}
  .moveb{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--soft);
    background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 0;cursor:pointer;width:100%;}
  .moveb.buy{color:#46663F;border-color:#46663F55;}
  .empty{text-align:center;padding:54px 16px;border:1px dashed var(--line);border-radius:10px;background:#FBFAF680;margin-top:22px;}
  .empty .t{font-size:15px;font-weight:600;color:var(--soft);margin-bottom:6px;}
  .empty .s{font-size:13px;color:var(--faint);margin-bottom:16px;}
  .overlay{position:fixed;inset:0;background:#1B1A1766;display:none;align-items:flex-start;justify-content:center;
    padding:5vh 16px;z-index:50;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 24px 60px -20px #1b1a1755;padding:22px;}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .mhead h2{margin:0;font-size:17px;font-weight:700;}
  .x{border:none;background:none;font-size:22px;color:var(--faint);cursor:pointer;line-height:1;}
  .fl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:5px;margin-top:12px;}
  .frow{display:flex;gap:10px;}
  .mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .del{border:none;background:none;color:var(--accent);font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;}
  .mbtns{display:flex;gap:8px;}
  .cancel{padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--soft);font-size:13px;cursor:pointer;}
  .savebtn{padding:8px 16px;border-radius:5px;border:none;background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
  ::placeholder{color:var(--faint);}
  /* colour dots on cards */
  .cdots{display:flex;gap:5px;align-items:center;}
  .cdot{width:13px;height:13px;border-radius:50%;border:1px solid #1b1a1733;box-shadow:inset 0 0 0 1px #ffffff55;}
  /* swatch picker in modal */
  .swwrap{margin-top:4px;}
  .swfam{font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:8px 0 4px;}
  .swgrid{display:flex;flex-wrap:wrap;gap:5px;}
  .sw{width:22px;height:22px;border-radius:4px;border:1px solid #1b1a1722;cursor:pointer;padding:0;position:relative;}
  .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink);}
  .sw.clear{background:#fff;color:var(--faint);font-size:12px;display:flex;align-items:center;justify-content:center;}
  /* outfit cards */
  .grid.outfits{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .ocard{overflow:hidden;}
  .ostrip{display:flex;height:110px;background:#EFEBE2;border-bottom:1px solid var(--line);}
  .oth{flex:1;min-width:0;border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .oth:last-child{border-right:none;}
  .oth img{width:100%;height:100%;object-fit:cover;}
  .oth.ophc{opacity:.6;}
  .obig{display:block;width:34px;height:34px;border-radius:50%;border:1px solid #1b1a1733;}
  .omore{font-family:var(--mono);font-size:14px;color:var(--soft);background:#E4DFD4;}
  .oempty{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--faint);}
  .cok{font-family:var(--mono);font-size:11px;color:#46663F;letter-spacing:.2px;}
  .cwarn{font-family:var(--mono);font-size:11px;color:#9A6A12;letter-spacing:.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .cwarn .cdot,.cok .cdot{width:11px;height:11px;}
  .cnote{font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .linkb{border:none;background:none;color:var(--accent);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;padding:0;}
  /* pick grid in outfit modal */
  .pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:4px;}
  .pit{padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;text-align:left;}
  .pit.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);}
  .pitph{width:100%;height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .pitph img{width:100%;height:100%;object-fit:cover;display:block;}
  .pitn{font-size:11px;line-height:1.2;padding:5px 6px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .clashprev{margin-top:10px;min-height:18px;}
  /* sort, stats, sale */
  .sortsel{width:auto;flex:0 0 auto;background:var(--card);font-size:13px;padding:9px 8px;}
  .stats{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.3px;margin:12px 0 0;min-height:14px;}
  .saletag{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:#9A6A12;border-radius:3px;padding:2px 6px;z-index:1;}
  .price s{margin-left:4px;font-size:10px;color:var(--faint);}
  .cap-a{display:inline-block;text-decoration:none;margin:4px 0 2px;}
  .cap-a:active{transform:translateY(1px);}
  .metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cat{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--soft);background:#00000008;border:1px solid var(--line);border-radius:3px;padding:2px 6px;}
  .gapnote{font-family:var(--mono);font-size:10.5px;color:#9A6A12;letter-spacing:.2px;margin-top:4px;}
  .photobox{border:1.5px dashed var(--line);border-radius:8px;background:#EFEBE2;min-height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;text-align:center;color:var(--faint);font-family:var(--mono);font-size:12px;padding:10px;margin-top:4px;}
  .photobox.has{border-style:solid;padding:0;background:#000;}
  .photobox img{width:100%;max-height:280px;object-fit:contain;display:block;}
  .photohint{line-height:1.5;}
  .photohint b{color:var(--soft);font-weight:600;}
  /* quantity stepper */
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff;}
  .qty button{border:none;background:none;font-family:var(--mono);font-size:14px;line-height:1;color:var(--soft);padding:3px 8px;cursor:pointer;}
  .qty button:hover{background:#00000010;color:var(--ink);}
  .qty button:disabled{opacity:.3;cursor:default;background:none;}
  .qty i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink);padding:0 4px;min-width:22px;text-align:center;}
  .mqty{margin-top:4px;}
  .qhint{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.4;}
  /* cutout controls */
  .photobox.cut{background:#EFEBE2;padding:6px;}
  .photobox.cut img{object-fit:contain;max-height:260px;}
  .phrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px;flex-wrap:wrap;}
  .cutlbl{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--soft);cursor:pointer;}
  .cutlbl input{width:auto;margin:0;}
  .cutnote{font-family:var(--mono);font-size:10.5px;color:#9A6A12;line-height:1.4;margin-top:5px;min-height:14px;}
  /* a cut-out garment must sit ON the surface, not be cropped to fill a box */
  .thumb img.cutimg,.oth img.cutimg,.pitph img.cutimg,.bph img.cutimg{object-fit:contain;}
  .thumb img.cutimg{padding:8px;}
  .bph img.cutimg{padding:2px;}
  /* ---- build tab: the closet stack ----------------------------------------
     One continuous column, no card chrome. Each row is scaled to roughly its
     real-world proportion (--rh), the selected garment sits in a fixed centre
     lane, and neighbours are scaled DOWN rather than dimmed so you can still
     see what's coming as you scroll. */
  .bstack{display:flex;flex-direction:column;gap:0;margin-top:16px;}
  .brow{position:relative;transition:opacity .15s ease;}
  .brow.off{opacity:.35;pointer-events:none;}
  /* labels float over the row's empty top corners instead of consuming a line each —
     that's the difference between five stacked widgets and one continuous column */
  .brhead{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 3px;}
  .brlabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);flex:0 0 auto;opacity:.8;}
  .brpick{font-size:11px;font-weight:600;color:var(--soft);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .brpick.non{font-weight:400;color:var(--faint);opacity:.55;}
  /* the centre lane — a quiet guide the selected pieces line up inside */
  .blane{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:120px;
    border-left:1px solid var(--line);border-right:1px solid var(--line);opacity:.5;pointer-events:none;z-index:0;}
  .brscroll{display:flex;align-items:flex-end;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-behavior:smooth;
    padding:0 calc(50% - 60px);height:var(--rh);position:relative;z-index:1;}
  .brscroll::-webkit-scrollbar{display:none;}
  .bitem{flex:0 0 120px;scroll-snap-align:center;padding:0;border:none;background:none;cursor:pointer;
    height:100%;display:flex;align-items:flex-end;justify-content:center;
    transform:scale(.62);transform-origin:bottom center;opacity:.85;
    transition:transform .18s ease,opacity .18s ease;}
  .bitem.on{transform:scale(1);opacity:1;}
  .bph{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;overflow:visible;background:none!important;}
  /* garment sits ON the row baseline and fills its height — this is what makes a
     cap read as small and a jacket as tall without any per-item fiddling */
  .bph img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}
  .bitem.bnone{opacity:.4;}
  .bitem.bnone.on{opacity:.75;}
  .bitem.bnone .bnone-in{width:44px;height:44px;border:1px dashed var(--line);border-radius:50%;
    display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:14px;background:none;}
  .bswatch{width:74px;height:100%;border-radius:6px;border:1px solid #1b1a1722;}
  .brempty{font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:0 2px;height:var(--rh);
    display:flex;align-items:center;justify-content:center;opacity:.7;}
  .bfeed{margin-top:16px;padding:13px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px;}
  .bfrow{min-height:17px;}
  .bfrow+.bfrow{margin-top:5px;}
  .bbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .bbtns .savebtn{flex:1 1 130px;}
  /* metadata sheet — hidden until Save, so the stack owns the screen */
  .bsheet{display:none;}
  .bsheet.open{display:block;}
  @media (prefers-reduced-motion:reduce){.rcard{transition:none;}.brscroll{scroll-behavior:auto;}.bitem{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3.2c-1.5 0-2.6 1.1-2.6 2.5 0 1 .6 1.7 1.5 2.1L3.2 13c-.7.4-1.1 1-1.1 1.7 0 1 .8 1.6 1.8 1.6h16.2c1 0 1.8-.6 1.8-1.6 0-.7-.4-1.3-1.1-1.7l-7.7-5.2" stroke="#1B1A17" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <div class="word">rack</div>
        <div class="sub">wishlist · wardrobe · brands</div>
      </div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="captureBtn" title="Quick-capture from a shop page">Capture +</button>
      <button class="ghost" id="sizesBtn" title="Your general sizes">Sizes</button>
      <button class="ghost" id="importBtn" title="Load a backup file">Import &#8593;</button>
      <button class="ghost" id="exportBtn" title="Download a backup file">Export &#8595;</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="wardrobe">Wardrobe <span class="n" id="cWardrobe">0</span></button>
    <button class="tab" data-tab="build">Build</button>
    <button class="tab" data-tab="outfits">Outfits <span class="n" id="cOutfits">0</span></button>
    <button class="tab" data-tab="pieces">Pieces <span class="n" id="cPieces">0</span></button>
    <button class="tab" data-tab="brands">Brands <span class="n" id="cBrands">0</span></button>
    <button class="tab" data-tab="capsules">Capsules <span class="n" id="cCapsules">0</span></button>
  </div>

  <div class="controls" id="controls">
    <div class="searchbox"><span>&#9906;</span><input id="search" placeholder="Search…" /></div>
    <select id="sortSel" class="sortsel"></select>
    <button class="add" id="addBtn">+ Add piece</button>
  </div>

  <div id="stats" class="stats"></div>
  <div id="content"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function(){
  "use strict";
  // ---- photo storage (IndexedDB) + colour extraction (rack_2) ----
  var photoCache={};
  var _db=null;
  function openDB(cb){
    if(_db){cb(_db);return;}
    if(typeof indexedDB==="undefined"){cb(null);return;}
    try{
      var rq=indexedDB.open("rack_media",1);
      rq.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos");};
      rq.onsuccess=function(e){_db=e.target.result;cb(_db);};
      rq.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  }
  function idbPut(id,data){openDB(function(db){if(!db)return;try{db.transaction("photos","readwrite").objectStore("photos").put(data,id);}catch(e){}});}
  function idbDel(id){openDB(function(db){if(!db)return;try{db.transaction("photos","readwrite").objectStore("photos").delete(id);}catch(e){}});}
  function idbClear(cb){openDB(function(db){if(!db){cb&&cb();return;}try{var t=db.transaction("photos","readwrite");t.objectStore("photos").clear();t.oncomplete=function(){cb&&cb();};t.onerror=function(){cb&&cb();};}catch(e){cb&&cb();}});}
  function idbAll(cb){openDB(function(db){if(!db){cb({});return;}try{var out={},t=db.transaction("photos","readonly"),cr=t.objectStore("photos").openCursor();cr.onsuccess=function(e){var c=e.target.result;if(c){out[c.key]=c.value;c.continue();}else cb(out);};cr.onerror=function(){cb(out);};}catch(e){cb({});}});}
  // Cutouts live under a separate IndexedDB key so the original is never destroyed —
  // toggling `cutout` off must always be able to fall back to the untouched photo.
  var CUT_SUFFIX="__cut";
  function cutKey(id){return id+CUT_SUFFIX;}
  function isCutKey(k){return k.slice(-CUT_SUFFIX.length)===CUT_SUFFIX;}
  function rawPhotoOf(it){return (it&&photoCache[it.id])||(it&&it.image)||"";}
  function photoOf(it){
    if(!it)return "";
    if(it.cutout!==false&&photoCache[cutKey(it.id)])return photoCache[cutKey(it.id)];
    return rawPhotoOf(it);
  }
  function hasCutout(it){return !!(it&&photoCache[cutKey(it.id)]);}
  // Five identical white shirts are one entry with a count, not five cards. Keeps the
  // closet stack readable and means laundry tracking can later say "3 of 5 clean".

  function allTags(data){
    var s={};data.forEach(function(d){(d.tags||[]).forEach(function(t){s[t]=1;});});
    return Object.keys(s).sort();

  function visible(){
    var data=baseData(),q=state.search.trim().toLowerCase();
    var res=data.filter(function(d){return state.statusF==="all"||d.status===state.statusF;})
      .filter(function(d){return !state.tagF||(d.tags||[]).indexOf(state.tagF)>-1;})
      .filter(function(d){return !state.colorF||!!itemFamilies(d)[state.colorF];})
      .filter(function(d){return !state.catF||d.category===state.catF;})
      .filter(function(d){return !state.occF||d.occasion===state.occF;})
      .filter(function(d){return !state.saleOnly||isOnSale(d);})
      .filter(function(d){
        if(!q)return true;
        var parts=[d.name,d.brand,d.notes,d.tag].concat(d.tags||[]);
        if(d.itemIds){outfitPieces(d).forEach(function(it){if(it)parts.push(it.name);});}
        var hay=parts.filter(Boolean).join(" ").toLowerCase();
        return hay.indexOf(q)>-1;
      });
    var s=state.sort;
    res.sort(function(a,b){
      if(s==="name")return String(a.name||"").localeCompare(String(b.name||""));
      if(s==="old")return (a.createdAt||0)-(b.createdAt||0);
      if(s==="phi"||s==="plo"){
        var pa=priceNum(a.price),pb=priceNum(b.price);
        if(pa==null&&pb==null)return (b.createdAt||0)-(a.createdAt||0);
        if(pa==null)return 1; if(pb==null)return -1;
        return s==="phi"?pb-pa:pa-pb;
      }
      return (b.createdAt||0)-(a.createdAt||0);
    });
    return res;
  }

      if(i.status!=="bought")return false;

  function openBuildSheet(open){

  function centreInRow(cont,el,smooth){
    if(!cont||!el)return;
    var cr=cont.getBoundingClientRect(),er=el.getBoundingClientRect();
    var delta=(er.left-cr.left)-(cr.width-er.width)/2;
    if(Math.abs(delta)<1)return;
    if(!smooth){
      var prev=cont.style.scrollBehavior;cont.style.scrollBehavior="auto";
      cont.scrollLeft+=delta;cont.style.scrollBehavior=prev;
    }else cont.scrollLeft+=delta;
  }
  function afterBuildRender(){

      var cont=document.querySelector('[data-scroll="'+r[0]+'"]');if(!cont)return;

      var el=cont.querySelector('[data-id="'+(id||"")+'"]');
      centreInRow(cont,el,false);

  function refreshBuildChrome(){
    var full=isFullActive();

      var slot=r[0],row=document.querySelector('.brow[data-row="'+slot+'"]');if(!row)return;
      var off=(slot==="bottom"&&full);
      row.classList.toggle("off",off);
      var pick=pickedItem(slot),lbl=row.querySelector(".brpick");
      if(lbl){
        lbl.textContent=off?"covered by one-piece":(pick?pick.name:"none");
        lbl.classList.toggle("non",!pick||off);
      }
      if(off){
        var c=row.querySelector('[data-scroll="bottom"]');
        if(c){
          var noneEl=null;
          [].forEach.call(c.querySelectorAll(".bitem"),function(b){
            var isNone=!b.getAttribute("data-id");
            b.classList.toggle("on",isNone);
            if(isNone)noneEl=b;

          centreInRow(c,noneEl,true);
        }
      }
    });
    var f=document.getElementById("bFeed");if(f)f.innerHTML=buildFeedHtml();

  function buildPick(slot,id){
    build.picks[slot]=id;
    if(slot==="top"){
      var it=id?findItem(id):null;
      if(it&&CAT_SLOT[it.category]==="full")build.picks.bottom="";   // one-piece covers the bottom
    }
    var cont=document.querySelector('[data-scroll="'+slot+'"]');
    if(cont){
      var target=null;
      [].forEach.call(cont.querySelectorAll(".bitem"),function(b){
        var on=(b.getAttribute("data-id")||"")===(id||"");
        b.classList.toggle("on",on);
        if(on)target=b;
      });
      // tapping both selects AND slides it into the centre lane, so the middle of the
      // stack always reads as the outfit you've currently got assembled
      centreInRow(cont,target,true);

    refreshBuildChrome();

  function saveBuild(){
    readBuildFields();
    var items=buildPickedItems();
    if(!items.length){alert("Pick at least one piece before saving.");return;}
    var ids=items.map(function(it){return it.id;});
    (build.extraIds||[]).forEach(function(x){if(ids.indexOf(x)<0&&findItem(x))ids.push(x);});
    var o={id:build.editId||uid(),createdAt:Date.now(),name:build.name||"Untitled outfit",
           occasion:build.occasion,tags:build.tags.slice(),notes:build.notes,
           itemIds:ids,clashOk:null};
    if(build.editId){
      for(var i=0;i<state.outfits.length;i++)if(state.outfits[i].id===build.editId){
        o.createdAt=state.outfits[i].createdAt;
        o.clashOk=state.outfits[i].clashOk||null;   // stale sig simply won't match, so the flag returns
        state.outfits[i]=o;break;
      }
    }else state.outfits.unshift(o);

  // Duplicate is for "same shirt, different colour" — a genuinely different piece that
  // saves retyping. Photos are keyed by item id, so they have to be copied across too.
  function duplicatePiece(){
    if(!modalState||modalState.kind!=="piece"||!modalState.draft.id)return;
    var src=findItem(modalState.draft.id);if(!src)return;
    var copy=JSON.parse(JSON.stringify(src));
    copy.id=uid();copy.createdAt=Date.now();copy.name=src.name+" (copy)";copy.qty=1;
    if(photoCache[src.id]){photoCache[copy.id]=photoCache[src.id];idbPut(copy.id,photoCache[src.id]);}
    if(photoCache[cutKey(src.id)]){photoCache[cutKey(copy.id)]=photoCache[cutKey(src.id)];idbPut(cutKey(copy.id),photoCache[cutKey(src.id)]);}
    state.items.unshift(copy);save();
    closeModal();render();
    openModal("piece",JSON.parse(JSON.stringify(copy)));
  }

  function saveModal(){
    if(!modalState)return;
    var kind=modalState.kind, d=modalState.draft, creating=!(d&&d.id);
    if(kind==="capsule"){
      var cname=document.getElementById("m_name").value.trim();
      var ctag=document.getElementById("m_tag").value.trim().toLowerCase();
      if(!cname||!ctag)return;
      var c={id:d.id,createdAt:d.createdAt,name:cname,tag:ctag,notes:document.getElementById("m_notes").value.trim()};
      if(c.id){for(var r=0;r<state.capsules.length;r++)if(state.capsules[r].id===c.id){state.capsules[r]=c;break;}}
      else{c.id=uid();c.createdAt=Date.now();state.capsules.unshift(c);}
      save();closeModal();if(creating)clearFilters();render();return;
    }
    var isPiece=kind==="piece";
    var name=document.getElementById("m_name").value.trim();
    if(!name)return;
    var tags=document.getElementById("m_tags").value.split(",").map(function(t){return t.trim().toLowerCase();}).filter(Boolean);
    var uniq=[];tags.forEach(function(t){if(uniq.indexOf(t)<0)uniq.push(t);});
    var obj={
      id:d.id,createdAt:d.createdAt,name:name,
      url:document.getElementById("m_url").value.trim(),
      status:document.getElementById("m_status").value,
      tags:uniq,notes:document.getElementById("m_notes").value.trim()
    };
    if(isPiece){
      obj.brand=document.getElementById("m_brand").value.trim();
      obj.category=document.getElementById("m_cat").value;
      obj.occasion=document.getElementById("m_occasion").value;
      obj.size=document.getElementById("m_size").value.trim();
      obj.price=document.getElementById("m_price").value.trim();
      obj.wasPrice=document.getElementById("m_was").value.trim();
      obj.image=document.getElementById("m_image").value.trim();
      obj.color=d.color||"";
      obj.accents=(d.accents||[]).slice();
      obj.qty=qtyOf(d);
    }
    var list=isPiece?state.items:state.brands;
    if(obj.id){for(var i=0;i<list.length;i++)if(list[i].id===obj.id){list[i]=obj;break;}}
    else{obj.id=uid();obj.createdAt=Date.now();list.unshift(obj);}
    if(isPiece){
      var dr=modalState.draft;
      var cutBox=document.getElementById("m_cutout");
      obj.cutout=cutBox?!!cutBox.checked:(dr.cutout!==false);
      if(dr.photoData){
        idbPut(obj.id,dr.photoData);photoCache[obj.id]=dr.photoData;obj.photo=true;
        if(dr.cutData){idbPut(cutKey(obj.id),dr.cutData);photoCache[cutKey(obj.id)]=dr.cutData;}
        else{idbDel(cutKey(obj.id));delete photoCache[cutKey(obj.id)];}
      }
      else if(dr.photoRemove){
        idbDel(obj.id);delete photoCache[obj.id];obj.photo=false;
        idbDel(cutKey(obj.id));delete photoCache[cutKey(obj.id)];
      }
      else obj.photo=!!dr.photo;
    }
    save();closeModal();if(creating)clearFilters();render();
  }
  function deleteModal(){
    if(!modalState||!modalState.draft.id)return;
    var kind=modalState.kind, id=modalState.draft.id;
    if(kind==="piece"){
      state.items=state.items.filter(function(x){return x.id!==id;});
      state.outfits.forEach(function(o){o.itemIds=(o.itemIds||[]).filter(function(x){return x!==id;});});
      idbDel(id);delete photoCache[id];
      idbDel(cutKey(id));delete photoCache[cutKey(id)];
    }
    else if(kind==="outfit")state.outfits=state.outfits.filter(function(x){return x.id!==id;});
    else if(kind==="capsule")state.capsules=state.capsules.filter(function(x){return x.id!==id;});
    else state.brands=state.brands.filter(function(x){return x.id!==id;});
    save();closeModal();render();

  // A backup must round-trip EVERYTHING. capsules + sizes were missing until v2 — any
  // backup taken before this silently dropped them on restore.
  function exportData(){
    var payload={v:2,items:state.items,brands:state.brands,outfits:state.outfits,
                 capsules:state.capsules,sizes:state.sizes,photos:photoCache,
                 exportedAt:new Date().toISOString()};
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="rack-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }
  function importData(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!data||(!Array.isArray(data.items)&&!Array.isArray(data.brands)))throw 0;
        if(!confirm("Replace everything currently in rack with this backup?"))return;
        state.items=Array.isArray(data.items)?data.items:[];
        state.brands=Array.isArray(data.brands)?data.brands:[];
        state.outfits=Array.isArray(data.outfits)?data.outfits:[];
        state.capsules=Array.isArray(data.capsules)?data.capsules:[];
        state.sizes=(data.sizes&&typeof data.sizes==="object")?data.sizes:{};
        var photos=(data.photos&&typeof data.photos==="object")?data.photos:{};
        photoCache={};Object.keys(photos).forEach(function(id){photoCache[id]=photos[id];});
        idbClear(function(){Object.keys(photos).forEach(function(id){idbPut(id,photos[id]);});});
        migrateCategories(state.items);
        build=freshBuild();
        save();render();
      }catch(e){alert("That file isn't a valid rack backup.");}
    };
    r.readAsText(file);
  }

  // Runs ON the shop page, which is the whole point — no CORS wall, full DOM access.
  // Prefers schema.org/Product JSON-LD (brand, colour, sizes, price, real product image),
  // falls back to OpenGraph, then to the largest image on the page.
  function bookmarkletHref(){
    var base=location.href.split("#")[0].replace(/'/g,"%27");
    var c="(function(){";
    c+="function M(p){var l=document.getElementsByTagName('meta'),i,e;for(i=0;i<l.length;i++){e=l[i];if(e.getAttribute('property')===p||e.getAttribute('name')===p)return e.content||'';}return '';}";
    c+="function A(v){return Object.prototype.toString.call(v)==='[object Array]';}";
    c+="function P(){var out=null;function w(n){if(!n||out)return;if(A(n)){for(var i=0;i<n.length;i++)w(n[i]);return;}if(typeof n!=='object')return;var t=n['@type'];if(t&&((t==='Product')||(A(t)&&t.indexOf('Product')>-1))){out=n;return;}if(n['@graph'])w(n['@graph']);for(var k in n){if(k!=='@graph'&&n[k]&&typeof n[k]==='object')w(n[k]);}}";
    c+="var s=document.getElementsByTagName('script'),i;for(i=0;i<s.length;i++){if((s[i].type||'').indexOf('ld+json')<0)continue;try{w(JSON.parse(s[i].textContent));}catch(e){}}return out;}";
    c+="function S(v){return (typeof v==='string')?v:(v&&v.name)?v.name:'';}";
    c+="function I(v){if(!v)return '';if(typeof v==='string')return v;if(A(v))return I(v[0]);if(v.url)return v.url;return '';}";
    c+="var p=P()||{},d={},q;";
    c+="d.name=p.name||M('og:title')||document.title||'';";
    c+="d.brand=S(p.brand)||M('og:site_name')||'';";
    c+="d.colorName=(typeof p.color==='string')?p.color:'';";
    c+="d.image=I(p.image)||M('og:image')||'';";
    c+="var o=p.offers,ar=o?(A(o)?o:[o]):[],pr='',cu='';";
    c+="for(q=0;q<ar.length;q++){var x=ar[q];if(!x)continue;var v=x.price||x.lowPrice;if(v&&!pr){pr=String(v);cu=x.priceCurrency||'';}}";
    c+="if(!pr){pr=M('og:price:amount')||M('product:price:amount')||'';cu=M('og:price:currency')||M('product:price:currency')||'';}";
    c+="var sy={EUR:'\\u20AC',USD:'$',GBP:'\\u00A3'}[cu]||(cu?cu+' ':'');";
    c+="d.price=pr?(sy+pr):'';";
    c+="var sz=[];function AS(v){if(v&&typeof v==='string'&&sz.indexOf(v)<0)sz.push(v);}AS(p.size);";
    c+="for(q=0;q<ar.length;q++){if(!ar[q])continue;AS(ar[q].size);if(ar[q].itemOffered)AS(ar[q].itemOffered.size);}";
    c+="var hv=p.hasVariant?(A(p.hasVariant)?p.hasVariant:[p.hasVariant]):[];for(q=0;q<hv.length;q++){if(hv[q])AS(hv[q].size);}";
    c+="d.sizes=sz.slice(0,14);d.url=location.href;";
    c+="if(!d.image){var b=null,im=document.images,j;for(j=0;j<im.length;j++){if(im[j].naturalWidth>200&&(!b||im[j].naturalWidth*im[j].naturalHeight>b.naturalWidth*b.naturalHeight))b=im[j];}if(b)d.image=b.src;}";
    c+="function go(){var t=JSON.stringify(d);try{navigator.clipboard.writeText(t);}catch(e){}window.open('"+base+"#cap='+btoa(unescape(encodeURIComponent(t))),'rack');}";
    // Inline the photo as data while we're still on the shop's origin — rack itself
    // usually can't fetch a retailer CDN. Skip if it's too big to survive a URL.
    c+="if(d.image&&d.image.indexOf('data:')!==0){fetch(d.image).then(function(r){return r.blob();}).then(function(bl){if(bl.size>260000){go();return;}var fr=new FileReader();fr.onload=function(){d.image=fr.result;go();};fr.onerror=go;fr.readAsDataURL(bl);})['catch'](go);}else go();";
    c+="})();";
    return "javascript:"+c;
  }
  // Shops name colours in words; rack stores hex. A stated colour beats pixel-averaging
  // a photo that still contains its background, so this wins over extraction.
  var COLOR_SYNONYMS={gray:"grey",anthracite:"charcoal",graphite:"charcoal",ecru:"cream",ivory:"cream",
    offwhite:"white","off white":"white",camel:"tan",khaki:"olive",denim:"blue",indigo:"navy",
    bordeaux:"burgundy",wine:"burgundy",maroon:"burgundy",taupe:"beige",sand:"beige",stone:"beige",
    ink:"navy",coral:"pink",fuchsia:"magenta",lilac:"lavender",mint:"sage",emerald:"forest",petrol:"teal",ecrufarben:"cream"};
  var _NAME2HEX=null;
  function nameHexMap(){
    if(_NAME2HEX)return _NAME2HEX;
    _NAME2HEX={};PALETTE.forEach(function(f){f.list.forEach(function(c){_NAME2HEX[c[0]]=c[1];});});
    return _NAME2HEX;
  }
  function colorFromName(s){
    if(!s)return "";
    var t=String(s).toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
    if(!t)return "";
    var names=nameHexMap();
    if(names[t])return names[t];
    for(var k in COLOR_SYNONYMS){if(t.indexOf(k)>-1&&names[COLOR_SYNONYMS[k]])return names[COLOR_SYNONYMS[k]];}
    var best="",bl=0;
    for(var n in names){if(t.indexOf(n)>-1&&n.length>bl){bl=n.length;best=names[n];}}
    return best;
  }
  function openCapture(){
    modalState={kind:"capture",draft:{}};
    var h='<div class="mhead"><h2>Quick capture</h2><button class="x" data-action="close">&times;</button></div>';
    h+='<p class="cnote" style="line-height:1.5;margin:0 0 8px">Drag this to your bookmarks bar. On any product page, click it — name, brand, colour, price, sizes and the product photo all come across, background already removed.</p>';
    h+='<a id="bmk" class="add cap-a">&#43; Save to rack</a>';
    h+='<p class="cnote" style="line-height:1.5;margin:14px 0 0">If the pop-up gets blocked, the item is also copied to your clipboard — paste it below. Pasting a bare link only saves the link: a page can\'t read another site for you, which is exactly what the bookmarklet gets around.</p>';
    h+='<label class="fl">Paste a product URL or copied capture data</label>';
    h+='<textarea id="cap_in" rows="3" style="resize:vertical" placeholder="https://…   or   {captured data}"></textarea>';
    h+='<div class="mfoot"><span></span><div class="mbtns"><button class="cancel" data-action="close">Close</button><button class="savebtn" data-action="prefillCapture">Prefill</button></div></div>';
    document.getElementById("modal").innerHTML=h;
    document.getElementById("overlay").classList.add("show");
    document.getElementById("bmk").href=bookmarkletHref();
  }
  function applyCapture(d){
    if(!d||typeof d!=="object")return;
    state.tab="pieces";state.statusF="all";state.tagF=null;state.colorF=null;state.catF=null;state.occF=null;state.saleOnly=false;
    var si=document.getElementById("search");if(si)si.value="";state.search="";render();
    var sizes=(Object.prototype.toString.call(d.sizes)==="[object Array]")?d.sizes.filter(Boolean):[];
    var draft={name:d.name||"",brand:d.brand||"",category:"",occasion:"",
      // one size listed means it's the size; a list of options is not a statement about you
      size:sizes.length===1?String(sizes[0]):"",
      url:d.url||"",price:d.price!=null?String(d.price):"",wasPrice:"",qty:1,
      image:"",color:colorFromName(d.colorName)||"",accents:[],tags:[],
      notes:sizes.length>1?("available: "+sizes.join(", ")):"",status:"later",cutout:true};
    var src=d.image||"";
    if(src&&src.indexOf("data:")!==0)draft.image=src;   // remote URL still displays even if unprocessable
    openModal("piece",draft);
    if(src)adoptCapturedImage(draft,src);
  }
  function adoptCapturedImage(draft,src){
    function note(t){var cn=document.getElementById("cutNote");if(cn)cn.textContent=t;}
    note("reading photo…");
    processPhotoSrc(src,function(durl,pal){
      if(!modalState||modalState.draft!==draft)return;
      if(!durl){note(draft.image?"couldn't process that image here — showing the shop's photo as-is":"");return;}
      draft.photoData=durl;draft.photoRemove=false;draft.image="";
      var im=document.getElementById("m_image");if(im)im.value="";
      if(pal){
        if(!draft.color&&pal.color)draft.color=pal.color;
        if(pal.accents&&!draft.accents.length)draft.accents=pal.accents.slice();
      }
      refreshSwatches();paintPhotoBox();note("removing background…");
      makeCutout(durl,function(cut){
        if(!modalState||modalState.draft!==draft)return;
        draft.cutData=cut||null;paintPhotoBox();
      });
    });
  }
  function prefillCapture(){
    var v=(document.getElementById("cap_in").value||"").trim();
    if(!v){closeModal();return;}
    var d=null;
    if(v.charAt(0)==="{"){try{d=JSON.parse(v);}catch(e){d=null;}}
    if(!d)d=/^https?:\/\//i.test(v)?{url:v}:{name:v};
    closeModal();applyCapture(d);
  }
  function openSizes(){
    modalState={kind:"sizes",draft:{}};
    var s=state.sizes||{};
    var h='<div class="mhead"><h2>Your sizes</h2><button class="x" data-action="close">&times;</button></div>';
    h+='<p class="cnote" style="line-height:1.5;margin:0 0 4px">General reference for what you typically wear — doesn\'t change any individual piece.</p>';
    h+='<label class="fl">Tops</label><input id="sz_top" value="'+esc(s.top||"")+'" placeholder="e.g. M"/>';
    h+='<label class="fl">Bottoms</label><input id="sz_bottom" value="'+esc(s.bottom||"")+'" placeholder="e.g. 32/32"/>';
    h+='<label class="fl">Shoes</label><input id="sz_shoes" value="'+esc(s.shoes||"")+'" placeholder="e.g. 43 EU"/>';
    h+='<label class="fl">Outerwear / suits</label><input id="sz_outer" value="'+esc(s.outer||"")+'" placeholder="e.g. L / 50"/>';
    h+='<label class="fl">Headwear</label><input id="sz_head" value="'+esc(s.head||"")+'" placeholder="e.g. 58cm / L"/>';
    h+='<div class="mfoot"><span></span><div class="mbtns"><button class="cancel" data-action="close">Cancel</button><button class="savebtn" data-action="saveSizes">Save</button></div></div>';
    document.getElementById("modal").innerHTML=h;
    document.getElementById("overlay").classList.add("show");
  }
  function saveSizes(){
    state.sizes={
      top:document.getElementById("sz_top").value.trim(),
      bottom:document.getElementById("sz_bottom").value.trim(),
      shoes:document.getElementById("sz_shoes").value.trim(),
      outer:document.getElementById("sz_outer").value.trim(),
      head:document.getElementById("sz_head").value.trim()
    };
    save();closeModal();
  }
  function checkHash(){
    var h=location.hash||"";
    if(h.indexOf("#cap=")!==0)return;
    var d=null;
    try{d=JSON.parse(decodeURIComponent(escape(atob(h.slice(5)))));}catch(e){d=null;}
    try{if(history&&history.replaceState)history.replaceState(null,"",location.pathname+location.search);else location.hash="";}catch(e){}
    if(d)applyCapture(d);
  }

  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab");if(!b)return;
    state.tab=b.getAttribute("data-tab");
    state.statusF="all";state.tagF=null;state.colorF=null;state.catF=null;state.occF=null;state.saleOnly=false;state.sort="new";state.search="";
    document.getElementById("search").value="";render();
  });
  document.getElementById("search").addEventListener("input",function(e){state.search=e.target.value;render();});
  document.getElementById("sortSel").addEventListener("change",function(e){state.sort=e.target.value;render();});
  document.getElementById("captureBtn").addEventListener("click",openCapture);
  document.getElementById("sizesBtn").addEventListener("click",openSizes);
  document.getElementById("addBtn").addEventListener("click",openNew);
  document.getElementById("exportBtn").addEventListener("click",exportData);
  document.getElementById("importBtn").addEventListener("click",function(){document.getElementById("importFile").click();});
  document.getElementById("importFile").addEventListener("change",function(e){if(e.target.files[0])importData(e.target.files[0]);e.target.value="";});

  document.getElementById("content").addEventListener("click",function(e){
    var b=e.target.closest("[data-action]");if(!b)return;
    var act=b.getAttribute("data-action"),id=b.getAttribute("data-id"),val=b.getAttribute("data-val");
    if(act==="edit")openEdit(id);
    else if(act==="bought")setStatus(id,"bought");
    else if(act==="relist")setStatus(id,"later");
    else if(act==="toggle")toggleWish(id);
    else if(act==="qtyUp"||act==="qtyDown"){
      var qit=findItem(id);
      if(qit){
        var nq=qtyOf(qit)+(act==="qtyUp"?1:-1);
        qit.qty=Math.max(1,Math.min(99,nq));
        save();render();
      }
    }
    else if(act==="status"){state.statusF=val;render();}
    else if(act==="tag"){state.tagF=state.tagF===val?null:val;render();}
    else if(act==="colorf"){state.colorF=val?(state.colorF===val?null:val):null;render();}
    else if(act==="catf"){state.catF=val?(state.catF===val?null:val):null;render();}
    else if(act==="occf"){state.occF=val?(state.occF===val?null:val):null;render();}
    else if(act==="saleonly"){state.saleOnly=!state.saleOnly;render();}
    else if(act==="add")openNew();
    else if(act==="editOutfit")openEditOutfit(id);
    else if(act==="dismissClash"){var o=findOutfit(id);if(o){o.clashOk=clashSig(o);save();render();}}
    else if(act==="undoClash"){var o2=findOutfit(id);if(o2){o2.clashOk=null;save();render();}}
    else if(act==="bpick"){
      var bslot=b.getAttribute("data-slot");
      if(bslot==="bottom"&&isFullActive())return;
      buildPick(bslot,id||"");
    }
    else if(act==="bopen"){
      if(!buildPickedItems().length){alert("Pick at least one piece first.");return;}
      openBuildSheet(true);
    }
    else if(act==="bclose"){readBuildFields();openBuildSheet(false);}
    else if(act==="bsave")saveBuild();
    else if(act==="bclear"){build=freshBuild();render();}
    else if(act==="bdelete"){
      if(build.editId&&confirm("Delete this outfit?")){
        var bdid=build.editId;
        state.outfits=state.outfits.filter(function(x){return x.id!==bdid;});
        build=freshBuild();save();state.tab="outfits";render();
      }
    }
    else if(act==="viewCapsule"){
      var cap=findCapsule(id);
      if(cap){
        state.tab=val;
        state.statusF="all";state.colorF=null;state.catF=null;state.occF=null;state.saleOnly=false;state.search="";
        state.tagF=cap.tag;
        document.getElementById("search").value="";
        render();
      }
    }
  });

  // keep the build tab's text fields mirrored into `build` so a re-render never loses typing
  ["input","change"].forEach(function(ev){
    document.getElementById("content").addEventListener(ev,function(){
      if(state.tab==="build"&&build)readBuildFields();
    });
  });

  var overlay=document.getElementById("overlay");
  overlay.addEventListener("mousedown",function(e){if(e.target===overlay)closeModal();});
  document.getElementById("modal").addEventListener("click",function(e){
    var b=e.target.closest("[data-action]");if(!b)return;
    var act=b.getAttribute("data-action");
    if(act==="close")closeModal();
    else if(act==="save")saveModal();
    else if(act==="delete")deleteModal();
    else if(act==="prefillCapture")prefillCapture();
    else if(act==="saveSizes")saveSizes();
    else if(act==="duplicate")duplicatePiece();
    else if(act==="qtyUp"||act==="qtyDown"){
      var dq=modalState.draft;
      dq.qty=Math.max(1,Math.min(99,qtyOf(dq)+(act==="qtyUp"?1:-1)));
      var box=document.getElementById("mQty");
      if(box)box.innerHTML=qtyHtml("__draft",qtyOf(dq));
    }
    else if(act==="takePhoto"){var fi=document.getElementById("m_photo");if(fi)fi.click();}
    else if(act==="clearPhoto"){
      var dr=modalState.draft;dr.photoData=null;dr.cutData=null;
      if(dr.id&&(photoCache[dr.id]||photoCache[cutKey(dr.id)]))dr.photoRemove=true;
      var pb=document.getElementById("photoBox");
      if(pb){pb.classList.remove("has");pb.classList.remove("cut");pb.innerHTML='<span class="photohint"><b>Take or choose a photo</b><br>colours fill in automatically</span>';}
      var pr=document.getElementById("phRow");if(pr)pr.style.display="none";
      var cn=document.getElementById("cutNote");if(cn)cn.textContent="";
    }
    else if(act==="pick"){
      var role=b.getAttribute("data-role"),hex=b.getAttribute("data-hex"),d=modalState.draft;
      if(role==="primary"){d.color=(d.color===hex)?"":hex;}
      else{d.accents=d.accents||[];var ix=d.accents.indexOf(hex);if(ix>-1)d.accents.splice(ix,1);else d.accents.push(hex);}
      refreshSwatches();
    }
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modalState)closeModal();});
  function paintPhotoBox(){
    if(!modalState)return;
    var dr=modalState.draft,pb=document.getElementById("photoBox");if(!pb)return;
    var cutOn=(dr.cutout!==false);
    var raw=dr.photoData||(dr.id&&!dr.photoRemove?photoCache[dr.id]:"")||"";
    var cut=dr.photoData?(dr.cutData||""):(dr.id&&!dr.photoRemove?(photoCache[cutKey(dr.id)]||""):"");
    var show=(cutOn&&cut)?cut:raw;
    pb.classList.toggle("has",!!show);
    pb.classList.toggle("cut",!!(cutOn&&cut));
    pb.innerHTML=show?('<img src="'+show+'" alt=""/>'):'<span class="photohint"><b>Take or choose a photo</b><br>colours fill in automatically</span>';
    var pr=document.getElementById("phRow");if(pr)pr.style.display=raw?"":"none";
    var cn=document.getElementById("cutNote");
    if(cn)cn.textContent=(raw&&!cut)?"couldn't separate this one from its background — using the photo as-is":"";
  }
  document.getElementById("modal").addEventListener("change",function(e){
    if(!e.target)return;
    if(e.target.id==="m_cutout"){
      if(modalState){modalState.draft.cutout=!!e.target.checked;paintPhotoBox();}
      return;
    }
    if(e.target.id==="m_photo"&&e.target.files&&e.target.files[0]){
      var pb=document.getElementById("photoBox");
      if(pb){pb.classList.remove("has");pb.classList.remove("cut");pb.innerHTML='<span class="photohint">reading photo…</span>';}
      processPhotoFile(e.target.files[0],function(durl,pal){
        if(!modalState)return;
        if(!durl){if(pb)pb.innerHTML='<span class="photohint">could not read that image</span>';return;}
        var dr=modalState.draft;dr.photoData=durl;dr.photoRemove=false;dr.cutData=null;
        if(pal){if(pal.color)dr.color=pal.color;if(pal.accents)dr.accents=pal.accents.slice();}
        if(pb){pb.classList.add("has");pb.innerHTML='<img src="'+durl+'" alt=""/>';}
        var pr=document.getElementById("phRow");if(pr)pr.style.display="";
        var cn=document.getElementById("cutNote");if(cn)cn.textContent="removing background…";
        refreshSwatches();
        makeCutout(durl,function(cut){
          if(!modalState||modalState.draft!==dr)return;
          dr.cutData=cut||null;
          paintPhotoBox();
        });
      });
      e.target.value="";
    }
  });

  // ---- backfill: give already-saved photos a cutout, one at a time, off the main path
  var _cutQueue=[],_cutBusy=false;
  function queueBackfill(){
    _cutQueue=state.items.filter(function(it){
      return photoCache[it.id]&&!photoCache[cutKey(it.id)]&&it.cutoutFailed!==true;
    }).map(function(it){return it.id;});
    runBackfill();
  }
  function runBackfill(){
    if(_cutBusy||!_cutQueue.length)return;
    _cutBusy=true;
    var id=_cutQueue.shift(),src=photoCache[id];
    if(!src){_cutBusy=false;runBackfill();return;}
    makeCutout(src,function(cut){
      var it=findItem(id);
      if(cut){
        photoCache[cutKey(id)]=cut;idbPut(cutKey(id),cut);
        if(it&&it.cutout===undefined)it.cutout=true;
        if(state.tab==="build"||state.tab==="wardrobe"||state.tab==="pieces")render();
      }else if(it){it.cutoutFailed=true;}
      save();
      _cutBusy=false;
      setTimeout(runBackfill,120);   // breathe between images so the UI stays responsive
    });
  }

  // Ask the browser to treat this storage as durable rather than cache it can evict.
  // Chrome/Firefox grant it on engagement; Safari ignores it — there, installing to the
  // Home Screen is the real protection. Costs nothing to ask.
  function requestPersistence(){
    try{
      if(navigator.storage&&navigator.storage.persist&&navigator.storage.persisted){
        navigator.storage.persisted().then(function(already){
          if(!already)navigator.storage.persist();
        });
      }
    }catch(e){}
  }
  function boot(){ requestPersistence(); load(); idbAll(function(p){ photoCache=p||{}; render(); checkHash(); setTimeout(queueBackfill,600); }); }
  window.addEventListener("hashchange",checkHash);
  boot();
})();
