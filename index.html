    --paper:#E9E5DC; --card:#FBFAF6; --ink:#1B1A17; --soft:#6B675E;
    --faint:#9A968C; --line:#D7D1C5; --accent:#7A2E2E;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
    --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 64px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:22px 0 16px;border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:10px;}
  .word{font-family:var(--serif);font-size:23px;letter-spacing:.5px;line-height:1;}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:3px;}
  .hbtns{display:flex;gap:8px;}
  .ghost{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--soft);background:transparent;border:1px solid var(--line);border-radius:5px;padding:6px 11px;cursor:pointer;}
  .ghost:hover{border-color:var(--ink);}
  .tabs{display:flex;gap:4px;margin-top:18px;flex-wrap:wrap;}
  .tab{font-family:var(--sans);font-size:15px;font-weight:500;color:var(--faint);background:none;border:none;
    border-bottom:2px solid transparent;padding:6px 10px 9px;cursor:pointer;}
  .tab.on{font-weight:700;color:var(--ink);border-bottom-color:var(--accent);}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .controls{display:flex;gap:10px;align-items:center;margin:16px 0 4px;flex-wrap:wrap;}
  .searchbox{position:relative;flex:1 1 220px;min-width:180px;}
  .searchbox span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;}
  input,textarea,select{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:5px;padding:9px 10px;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--ink);}
  #search{padding-left:28px;background:var(--card);}
  .add{font-family:var(--sans);font-size:14px;font-weight:600;color:#fff;background:var(--ink);border:none;
    border-radius:5px;padding:9px 16px;cursor:pointer;white-space:nowrap;}
  .filt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .seg{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:5px 9px;
    border-radius:4px;cursor:pointer;color:var(--soft);background:transparent;border:1px solid var(--line);}
  .seg.on{color:#fff;}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;}
  .tlabel{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-right:2px;}
  .chip{font-family:var(--mono);font-size:11px;color:var(--soft);background:#fff;border:1px solid var(--line);
    border-radius:3px;padding:2px 8px;cursor:pointer;}
  .chip.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .grid{display:grid;gap:14px;margin-top:22px;}
  .grid.pieces{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}
  .grid.brands{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .rcard{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;
    transition:transform .14s ease,box-shadow .14s ease;}
  .rcard:hover{transform:translateY(-2px);box-shadow:0 10px 26px -16px #1b1a1755;}
  .thumb{position:relative;height:150px;background:#EFEBE2;border-bottom:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.3;}
  .price{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:12px;color:var(--ink);
    background:#FBFAF6E6;border:1px solid var(--line);border-radius:4px;padding:2px 7px;}
  .body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1;}
  .toprow{display:flex;justify-content:space-between;gap:8px;}
  .name{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25;}
  .bname{font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.2;}
  .meta{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:2px;}
  .editb{flex-shrink:0;border:none;background:none;cursor:pointer;color:var(--faint);font-size:15px;}
  .tags{display:flex;flex-wrap:wrap;gap:4px;}
  .ttag{font-family:var(--mono);font-size:10px;color:var(--soft);background:#fff;border:1px solid var(--line);border-radius:3px;padding:1px 5px;}
  .notes{font-size:12px;color:var(--soft);line-height:1.4;}
  .foot{display:flex;flex-direction:column;gap:7px;margin-top:auto;padding-top:4px;}
  .footrow{display:flex;justify-content:space-between;align-items:center;}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:.3px;text-transform:uppercase;border-radius:3px;padding:1px 5px;border:1px solid;}
  .badgebtn{border:none;background:none;padding:0;cursor:pointer;}
  .openl{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);text-decoration:none;}
  .openl:hover{opacity:.7;}
  .moveb{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--soft);
    background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 0;cursor:pointer;width:100%;}
  .moveb.buy{color:#46663F;border-color:#46663F55;}
  .empty{text-align:center;padding:54px 16px;border:1px dashed var(--line);border-radius:10px;background:#FBFAF680;margin-top:22px;}
  .empty .t{font-size:15px;font-weight:600;color:var(--soft);margin-bottom:6px;}
  .empty .s{font-size:13px;color:var(--faint);margin-bottom:16px;}
  .overlay{position:fixed;inset:0;background:#1B1A1766;display:none;align-items:flex-start;justify-content:center;
    padding:5vh 16px;z-index:50;overflow-y:auto;}
  .overlay.show{display:flex;}
  .modal{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 24px 60px -20px #1b1a1755;padding:22px;}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .mhead h2{margin:0;font-size:17px;font-weight:700;}
  .x{border:none;background:none;font-size:22px;color:var(--faint);cursor:pointer;line-height:1;}
  .fl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:5px;margin-top:12px;}
  .frow{display:flex;gap:10px;}
  .mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;}
  .del{border:none;background:none;color:var(--accent);font-family:var(--mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;}
  .mbtns{display:flex;gap:8px;}
  .cancel{padding:8px 14px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--soft);font-size:13px;cursor:pointer;}
  .savebtn{padding:8px 16px;border-radius:5px;border:none;background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;}
  ::placeholder{color:var(--faint);}
  /* colour dots on cards */
  .cdots{display:flex;gap:5px;align-items:center;}
  .cdot{width:13px;height:13px;border-radius:50%;border:1px solid #1b1a1733;box-shadow:inset 0 0 0 1px #ffffff55;}
  /* swatch picker in modal */
  .swwrap{margin-top:4px;}
  .swfam{font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin:8px 0 4px;}
  .swgrid{display:flex;flex-wrap:wrap;gap:5px;}
  .sw{width:22px;height:22px;border-radius:4px;border:1px solid #1b1a1722;cursor:pointer;padding:0;position:relative;}
  .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink);}
  .sw.clear{background:#fff;color:var(--faint);font-size:12px;display:flex;align-items:center;justify-content:center;}
  /* outfit cards */
  .grid.outfits{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}
  .ocard{overflow:hidden;}
  .ostrip{display:flex;height:110px;background:#EFEBE2;border-bottom:1px solid var(--line);}
  .oth{flex:1;min-width:0;border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .oth:last-child{border-right:none;}
  .oth img{width:100%;height:100%;object-fit:cover;}
  .oth.ophc{opacity:.6;}
  .obig{display:block;width:34px;height:34px;border-radius:50%;border:1px solid #1b1a1733;}
  .omore{font-family:var(--mono);font-size:14px;color:var(--soft);background:#E4DFD4;}
  .oempty{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--faint);}
  .cok{font-family:var(--mono);font-size:11px;color:#46663F;letter-spacing:.2px;}
  .cwarn{font-family:var(--mono);font-size:11px;color:#9A6A12;letter-spacing:.2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .cwarn .cdot,.cok .cdot{width:11px;height:11px;}
  .cnote{font-family:var(--mono);font-size:10.5px;color:var(--faint);}
  .linkb{border:none;background:none;color:var(--accent);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;cursor:pointer;padding:0;}
  /* pick grid in outfit modal */
  .pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:4px;}
  .pit{padding:0;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;text-align:left;}
  .pit.on{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);}
  .pitph{width:100%;height:64px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
  .pitph img{width:100%;height:100%;object-fit:cover;display:block;}
  .pitn{font-size:11px;line-height:1.2;padding:5px 6px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .clashprev{margin-top:10px;min-height:18px;}
  /* sort, stats, sale */
  .sortsel{width:auto;flex:0 0 auto;background:var(--card);font-size:13px;padding:9px 8px;}
  .stats{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.3px;margin:12px 0 0;min-height:14px;}
  .saletag{position:absolute;top:8px;left:8px;font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:#fff;background:#9A6A12;border-radius:3px;padding:2px 6px;z-index:1;}
  .price s{margin-left:4px;font-size:10px;color:var(--faint);}
  .cap-a{display:inline-block;text-decoration:none;margin:4px 0 2px;}
  .cap-a:active{transform:translateY(1px);}
  .metarow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .cat{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--soft);background:#00000008;border:1px solid var(--line);border-radius:3px;padding:2px 6px;}
  .gapnote{font-family:var(--mono);font-size:10.5px;color:#9A6A12;letter-spacing:.2px;margin-top:4px;}
  .photobox{border:1.5px dashed var(--line);border-radius:8px;background:#EFEBE2;min-height:120px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;text-align:center;color:var(--faint);font-family:var(--mono);font-size:12px;padding:10px;margin-top:4px;}
  .photobox.has{border-style:solid;padding:0;background:#000;}
  .photobox img{width:100%;max-height:280px;object-fit:contain;display:block;}
  .photohint{line-height:1.5;}
  .photohint b{color:var(--soft);font-weight:600;}
  @media (prefers-reduced-motion:reduce){.rcard{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3.2c-1.5 0-2.6 1.1-2.6 2.5 0 1 .6 1.7 1.5 2.1L3.2 13c-.7.4-1.1 1-1.1 1.7 0 1 .8 1.6 1.8 1.6h16.2c1 0 1.8-.6 1.8-1.6 0-.7-.4-1.3-1.1-1.7l-7.7-5.2" stroke="#1B1A17" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>
        <div class="word">rack</div>
        <div class="sub">wishlist · wardrobe · brands</div>
      </div>
    </div>
    <div class="hbtns">
      <button class="ghost" id="captureBtn" title="Quick-capture from a shop page">Capture +</button>
      <button class="ghost" id="importBtn" title="Load a backup file">Import &#8593;</button>
      <button class="ghost" id="exportBtn" title="Download a backup file">Export &#8595;</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
    </div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="pieces">Pieces <span class="n" id="cPieces">0</span></button>
    <button class="tab" data-tab="wardrobe">Wardrobe <span class="n" id="cWardrobe">0</span></button>
    <button class="tab" data-tab="outfits">Outfits <span class="n" id="cOutfits">0</span></button>
    <button class="tab" data-tab="brands">Brands <span class="n" id="cBrands">0</span></button>
  </div>

  <div class="controls">
    <div class="searchbox"><span>&#9906;</span><input id="search" placeholder="Search…" /></div>
    <select id="sortSel" class="sortsel"></select>
    <button class="add" id="addBtn">+ Add piece</button>
  </div>

  <div id="stats" class="stats"></div>
  <div id="content"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
(function(){
  "use strict";
  // ---- photo storage (IndexedDB) + colour extraction (rack_2) ----
  var photoCache={};
  var _db=null;
  function openDB(cb){
    if(_db){cb(_db);return;}
    if(typeof indexedDB==="undefined"){cb(null);return;}
    try{
      var rq=indexedDB.open("rack_media",1);
      rq.onupgradeneeded=function(e){var db=e.target.result;if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos");};
      rq.onsuccess=function(e){_db=e.target.result;cb(_db);};
      rq.onerror=function(){cb(null);};
    }catch(e){cb(null);}
  }
  function idbPut(id,data){openDB(function(db){if(!db)return;try{db.transaction("photos","readwrite").objectStore("photos").put(data,id);}catch(e){}});}
  function idbDel(id){openDB(function(db){if(!db)return;try{db.transaction("photos","readwrite").objectStore("photos").delete(id);}catch(e){}});}
  function idbClear(cb){openDB(function(db){if(!db){cb&&cb();return;}try{var t=db.transaction("photos","readwrite");t.objectStore("photos").clear();t.oncomplete=function(){cb&&cb();};t.onerror=function(){cb&&cb();};}catch(e){cb&&cb();}});}
  function idbAll(cb){openDB(function(db){if(!db){cb({});return;}try{var out={},t=db.transaction("photos","readonly"),cr=t.objectStore("photos").openCursor();cr.onsuccess=function(e){var c=e.target.result;if(c){out[c.key]=c.value;c.continue();}else cb(out);};cr.onerror=function(){cb(out);};}catch(e){cb({});}});}
  function photoOf(it){return (it&&photoCache[it.id])||(it&&it.image)||"";}

  function _rgb(hex){hex=String(hex||"").replace("#","");return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];}
  var _PAL=null;
  function _pal(){if(_PAL)return _PAL;_PAL=[];PALETTE.forEach(function(f){f.list.forEach(function(c){_PAL.push({hex:c[1],rgb:_rgb(c[1])});});});return _PAL;}
  function nearestSwatch(c){var P=_pal(),best="",bd=1e9;for(var i=0;i<P.length;i++){var p=P[i].rgb,dr=c[0]-p[0],dg=c[1]-p[1],db=c[2]-p[2],d=dr*dr+dg*dg+db*db;if(d<bd){bd=d;best=P[i].hex;}}return best;}
  function dominantColors(px){var b={},step=16;for(var i=0;i<px.length;i+=step){if(px[i+3]<200)continue;var r=px[i],g=px[i+1],bl=px[i+2],key=((r>>4)<<8)|((g>>4)<<4)|(bl>>4);if(!b[key])b[key]={r:0,g:0,b:0,n:0};var bk=b[key];bk.r+=r;bk.g+=g;bk.b+=bl;bk.n++;}var arr=[];for(var k in b){var bk=b[k];arr.push({rgb:[Math.round(bk.r/bk.n),Math.round(bk.g/bk.n),Math.round(bk.b/bk.n)],n:bk.n});}arr.sort(function(a,b){return b.n-a.n;});return arr;}
  function extractPalette(px){var doms=dominantColors(px);if(!doms.length)return{color:"",accents:[]};var w={};doms.slice(0,40).forEach(function(d){var s=nearestSwatch(d.rgb);w[s]=(w[s]||0)+d.n;});var ranked=Object.keys(w).sort(function(a,b){return w[b]-w[a];});return{color:ranked[0]||"",accents:ranked.slice(1,3)};}
  function processPhotoFile(file,cb){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var mx=800,w=img.width,h=img.height,s=Math.min(1,mx/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*s)),ch=Math.max(1,Math.round(h*s));
        var cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
        var ctx=cv.getContext("2d");ctx.drawImage(img,0,0,cw,ch);
        var durl="";try{durl=cv.toDataURL("image/jpeg",0.82);}catch(e){durl="";}
        var pal={color:"",accents:[]};
        try{var x0=Math.floor(cw*0.15),y0=Math.floor(ch*0.15),x1=Math.ceil(cw*0.85),y1=Math.ceil(ch*0.85);var id=ctx.getImageData(x0,y0,Math.max(1,x1-x0),Math.max(1,y1-y0));pal=extractPalette(id.data);}catch(e){}
        cb(durl,pal);
      };
      img.onerror=function(){cb("",null);};
      img.src=fr.result;
    };
    fr.onerror=function(){cb("",null);};
    fr.readAsDataURL(file);
  }

  var LS_ITEMS="rack_items_v1", LS_BRANDS="rack_brands_v1", LS_OUTFITS="rack_outfits_v1";

  // ---- colour palette (real hex so matching maths works) ----
  var PALETTE=[
    {f:"neutral",list:[["black","#1B1A17"],["charcoal","#3A3A3A"],["grey","#8A8A88"],["silver","#C9C7C1"],["white","#F5F3EC"],["cream","#EDE6D6"],["beige","#D8C3A5"],["tan","#B79B76"],["brown","#6E4E33"],["navy","#24304A"]]},
    {f:"red / pink",list:[["burgundy","#6E2233"],["red","#B23A3A"],["rust","#A6532E"],["pink","#D98CA6"],["magenta","#C7477E"]]},
    {f:"warm",list:[["orange","#D0812F"],["mustard","#C79A2E"],["yellow","#E3C64B"]]},
    {f:"green",list:[["olive","#6E7A3A"],["forest","#375A3C"],["sage","#9DAE8B"],["teal","#2E7D77"]]},
    {f:"blue / purple",list:[["sky","#5A83B0"],["blue","#2F5FA6"],["cobalt","#274690"],["purple","#5E4B8A"],["lavender","#A99BC4"]]}
  ];
  // clash tuning — only loud, saturated colours in the discord hue-zone trip a flag
  var CLASH_MIN=45, CLASH_MAX=100, LOUD_S=0.5, NEU_S=0.15;

  function hx2hsl(hex){
    hex=String(hex||"").replace("#","");
    if(hex.length===3)hex=hex.split("").map(function(c){return c+c;}).join("");
    if(hex.length!==6)return null;
    var r=parseInt(hex.slice(0,2),16)/255,g=parseInt(hex.slice(2,4),16)/255,b=parseInt(hex.slice(4,6),16)/255;
    if(isNaN(r)||isNaN(g)||isNaN(b))return null;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s=0,h=0,d=mx-mn;
    if(d){
      s=d/(1-Math.abs(2*l-1));
      if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4;
      h*=60; if(h<0)h+=360;
    }
    return {h:h,s:s,l:l};
  }
  function isNeutral(c){return !c||c.s<NEU_S||c.l<=0.12||c.l>=0.90;}
  function isLoud(c){return !!c&&!isNeutral(c)&&c.s>=LOUD_S;}
  function hueDist(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d;}
  function clashPairs(hexes){
    var loud=[];
    hexes.forEach(function(h){var c=hx2hsl(h);if(isLoud(c))loud.push({hex:h,c:c});});
    var out=[];
    for(var i=0;i<loud.length;i++)for(var j=i+1;j<loud.length;j++){
      var d=hueDist(loud[i].c.h,loud[j].c.h);
      if(d>=CLASH_MIN&&d<=CLASH_MAX)out.push([loud[i].hex,loud[j].hex]);
    }
    return out;
  }
  function dot(hex){return '<span class="cdot" style="background:'+esc(hex)+'"></span>';}
  function clashHtml(primaries){
    if(primaries.length<2)return '<span class="cnote">Add colours to pieces to check matching</span>';
    var pairs=clashPairs(primaries);
    if(!pairs.length)return '<span class="cok">'+dot(primaries[0])+' Colours sit well together</span>';
    var p=pairs[0], extra=pairs.length>1?(" +"+(pairs.length-1)+" more"):"";
    return '<span class="cwarn">&#9650; Possible clash '+dot(p[0])+dot(p[1])+esc(extra)+'</span>';
  }
  var HEX2FAM={};
  PALETTE.forEach(function(fam){fam.list.forEach(function(c){HEX2FAM[c[1]]=fam.f;});});
  var CATEGORIES=[["top","Top"],["bottom","Bottom"],["full","Dress / one-piece"],["outer","Outerwear"],["shoes","Shoes"],["acc","Accessory"]];
  var CAT_LABEL={},CAT_PLURAL={top:"tops",bottom:"bottoms",full:"one-pieces",outer:"outerwear",shoes:"shoes",acc:"accessories"};
  CATEGORIES.forEach(function(c){CAT_LABEL[c[0]]=c[1];});
  function coverage(arr){
    var by={};arr.forEach(function(i){if(i.category)by[i.category]=(by[i.category]||0)+1;});
    var parts=[];CATEGORIES.forEach(function(c){if(by[c[0]])parts.push(by[c[0]]+" "+CAT_PLURAL[c[0]]);});
    return parts.join(", ");
  }  function itemFamilies(it){
    var fs={},arr=[];if(it.color)arr.push(it.color);(it.accents||[]).forEach(function(x){arr.push(x);});
    arr.forEach(function(h){var f=HEX2FAM[h];if(f)fs[f]=1;});
    return fs;
  }
  function priceNum(s){
    var m=String(s==null?"":s).match(/[0-9][0-9.,]*/);                    // first number token only
    if(!m)return null;
    var t=m[0], lc=t.lastIndexOf(","), ld=t.lastIndexOf(".");
    if(lc>-1&&ld>-1){                                                     // both present: last one is the decimal
      if(lc>ld)t=t.replace(/\./g,"").replace(",",".");                   // 1.234,56 -> 1234.56  (EU)
      else t=t.replace(/,/g,"");                                         // 1,299.00 -> 1299.00  (US)
    }else if(lc>-1){                                                      // comma only: 3 trailing digits => thousands, else decimal
      var p=t.split(",");
      if(p.length>2||(p.length===2&&p[1].length===3))t=t.replace(/,/g,""); // 1,299 -> 1299
      else t=t.replace(",",".");                                         // 12,50 -> 12.50
    }else if(ld>-1){                                                      // dot only: same heuristic (no 3-decimal retail prices)
      var pd=t.split(".");
      if(pd.length>2||(pd.length===2&&pd[1].length===3))t=t.replace(/\./g,""); // 2.999 -> 2999
    }
    var n=parseFloat(t);return isNaN(n)?null:n;
  }
  function isOnSale(it){var w=priceNum(it.wasPrice),p=priceNum(it.price);return w!=null&&p!=null&&w>p;}
  function money(n){return "€"+(Math.round(n*100)/100).toLocaleString("en-US");}
  function statsHtml(){
    var t=state.tab;
    function sum(arr){var s=0;arr.forEach(function(i){var p=priceNum(i.price);if(p)s+=p;});return s;}
    if(t==="pieces"){var w=state.items.filter(function(i){return i.status!=="bought";});if(!w.length)return "";
      var sale=w.filter(isOnSale).length;
      return w.length+" piece"+(w.length===1?"":"s")+" · "+money(sum(w))+" total"+(sale?" · "+sale+" on sale":"");}
    if(t==="wardrobe"){var b=state.items.filter(function(i){return i.status==="bought";});if(!b.length)return "";
      var cov=coverage(b);
      return b.length+" owned · "+money(sum(b))+" spent"+(cov?" · "+cov:"");}
    if(t==="outfits"){if(!state.outfits.length)return "";
      var cl=state.outfits.filter(function(o){var pr=outfitPrimaries(o);return clashPairs(pr).length&&o.clashOk!==clashSig(o);}).length;
      return state.outfits.length+" outfit"+(state.outfits.length===1?"":"s")+(cl?" · "+cl+" flagged":"");}
    if(t==="brands"){if(!state.brands.length)return "";
      var by={};state.brands.forEach(function(b){by[b.status]=(by[b.status]||0)+1;});
      var parts=[];for(var k in BRAND_STATUS)if(by[k])parts.push(by[k]+" "+BRAND_STATUS[k].label.toLowerCase());
      return state.brands.length+" brand"+(state.brands.length===1?"":"s")+(parts.length?" · "+parts.join(", "):"");}
    return "";
  }

  var PIECE_STATUS={
    want:{label:"Buy soon",color:"#7A2E2E",bg:"#7A2E2E16"},
    later:{label:"For later",color:"#6B675E",bg:"#6B675E16"},
    bought:{label:"Owned",color:"#46663F",bg:"#46663F1A"}
  };
  var BRAND_STATUS={
    cool:{label:"Cool",color:"#1B1A17",bg:"#1B1A1712"},
    deal:{label:"Deal now",color:"#9A6A12",bg:"#9A6A1222"},
    investigate:{label:"Investigate",color:"#3A5A78",bg:"#3A5A781C"},
    approved:{label:"Approved",color:"#46663F",bg:"#46663F1C"},
    avoid:{label:"Avoid",color:"#9A3B3B",bg:"#9A3B3B16"}
  };
  var state={tab:"pieces",search:"",statusF:"all",tagF:null,colorF:null,catF:null,saleOnly:false,sort:"new",items:[],brands:[],outfits:[]};
  var modalState=null;

  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  function load(){
    try{state.items=JSON.parse(localStorage.getItem(LS_ITEMS))||[];}catch(e){state.items=[];}
    try{state.brands=JSON.parse(localStorage.getItem(LS_BRANDS))||[];}catch(e){state.brands=[];}
    try{state.outfits=JSON.parse(localStorage.getItem(LS_OUTFITS))||[];}catch(e){state.outfits=[];}
  }
  function save(){
    try{
      localStorage.setItem(LS_ITEMS,JSON.stringify(state.items));
      localStorage.setItem(LS_BRANDS,JSON.stringify(state.brands));
      localStorage.setItem(LS_OUTFITS,JSON.stringify(state.outfits));
    }catch(e){alert("Could not save to this browser. Use Export to keep a backup.");}

  function badge(meta){
    return '<span class="badge" style="color:'+meta.color+';background:'+meta.bg+';border-color:'+meta.color+'33;">'+esc(meta.label)+'</span>';
  }
  function hanger(size){return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none"><path d="M12 3.2c-1.5 0-2.6 1.1-2.6 2.5 0 1 .6 1.7 1.5 2.1L3.2 13c-.7.4-1.1 1-1.1 1.7 0 1 .8 1.6 1.8 1.6h16.2c1 0 1.8-.6 1.8-1.6 0-.7-.4-1.3-1.1-1.7l-7.7-5.2" stroke="#6B675E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';}

    var h='<div class="rcard"><div class="thumb">';

    else{h+='<div class="ph">'+hanger(34)+'</div>';}

    h+='</div><div class="body">';
    h+='<div class="toprow"><div style="min-width:0"><div class="name">'+esc(it.name)+'</div>'+(it.brand?'<div class="meta">'+esc(it.brand)+'</div>':'')+'</div>';
    h+='<button class="editb" data-action="edit" data-id="'+it.id+'" title="Edit">&#9998;</button></div>';

    if(it.category||cols.length){
      h+='<div class="metarow">';
      if(it.category&&CAT_LABEL[it.category]){h+='<span class="cat">'+esc(CAT_LABEL[it.category])+'</span>';}

  function findOutfit(id){for(var i=0;i<state.outfits.length;i++)if(state.outfits[i].id===id)return state.outfits[i];return null;}
  function outfitPieces(o){return (o.itemIds||[]).map(function(id){return findItem(id);});}
  function outfitPrimaries(o){return outfitPieces(o).filter(function(it){return it&&it.status==="bought"&&it.color;}).map(function(it){return it.color;});}
  function clashSig(o){return outfitPrimaries(o).slice().sort().join("|");}
  function outfitGaps(live){
    if(live.length<2)return [];
    var cats={},known=0;
    live.forEach(function(it){if(it.category){cats[it.category]=1;known++;}});
    if(!known)return [];
    var g=[];
    if(!(cats.top||cats.full))g.push("top");
    if(!(cats.bottom||cats.full))g.push("bottom");
    if(!cats.shoes)g.push("shoes");
    return g;
  }
  function outfitIssues(o){
    var missing=0,moved=0;
    (o.itemIds||[]).forEach(function(id){var it=findItem(id);if(!it)missing++;else if(it.status!=="bought")moved++;});
    return {missing:missing,moved:moved};
  }
  function outfitCardHtml(o){
    var live=outfitPieces(o).filter(function(it){return it&&it.status==="bought";});
    var primaries=outfitPrimaries(o);
    var pairs=clashPairs(primaries);
    var iss=outfitIssues(o);
    var h='<div class="rcard ocard"><div class="ostrip">';
    if(live.length){
      live.slice(0,4).forEach(function(it){
        var oimg=photoOf(it);
        if(oimg){h+='<div class="oth" style="background:'+esc(it.color||"#EFEBE2")+'"><img src="'+esc(oimg)+'" alt="" onerror="this.style.display=\'none\'"/></div>';}
        else{h+='<div class="oth ophc">'+(it.color?'<span class="obig" style="background:'+esc(it.color)+'"></span>':hanger(24))+'</div>';}
      });
      if(live.length>4){h+='<div class="oth omore">+'+(live.length-4)+'</div>';}
    }else{h+='<div class="oempty">no wardrobe pieces</div>';}
    h+='</div><div class="body" style="gap:6px">';
    h+='<div class="toprow"><div style="min-width:0"><div class="name">'+esc(o.name||"Untitled outfit")+'</div>';
    h+='<div class="meta">'+live.length+' piece'+(live.length===1?"":"s")+'</div></div>';
    h+='<button class="editb" data-action="editOutfit" data-id="'+o.id+'" title="Edit">&#9998;</button></div>';
    if(o.tags&&o.tags.length){h+='<div class="tags">'+o.tags.map(function(t){return '<span class="ttag">'+esc(t)+'</span>';}).join("")+'</div>';}
    if(o.notes){h+='<div class="notes">'+esc(o.notes)+'</div>';}
    h+='<div class="foot">';
    if(!pairs.length){
      h+='<div class="footrow">'+clashHtml(primaries)+'</div>';
    }else if(o.clashOk===clashSig(o)){
      h+='<div class="footrow"><span class="cnote">clash okayed</span><button class="linkb" data-action="undoClash" data-id="'+o.id+'">recheck</button></div>';
    }else{
      h+='<div class="footrow">'+clashHtml(primaries)+'</div>';
      h+='<button class="moveb" data-action="dismissClash" data-id="'+o.id+'">Looks fine to me</button>';
    }
    if(iss.missing||iss.moved){
      var bits=[];if(iss.missing)bits.push(iss.missing+" deleted");if(iss.moved)bits.push(iss.moved+" back in wishlist");
      h+='<div class="cnote" style="margin-top:4px">&#9888; '+bits.join(", ")+'</div>';
    }
    var gaps=outfitGaps(live);
    if(gaps.length){h+='<div class="gapnote">&#9873; missing: '+gaps.join(", ")+'</div>';}
    h+='</div></div></div>';
    return h;
  }

  function baseData(){
    if(state.tab==="brands")return state.brands;
    if(state.tab==="outfits")return state.outfits;
    if(state.tab==="wardrobe")return state.items.filter(function(i){return i.status==="bought";});
    return state.items.filter(function(i){return i.status!=="bought";});
  }
  function allTags(data){
    var s={};data.forEach(function(d){(d.tags||[]).forEach(function(t){s[t]=1;});});
    return Object.keys(s).sort();
  }
  function visible(){
    var data=baseData(),q=state.search.trim().toLowerCase();
    var res=data.filter(function(d){return state.statusF==="all"||d.status===state.statusF;})
      .filter(function(d){return !state.tagF||(d.tags||[]).indexOf(state.tagF)>-1;})
      .filter(function(d){return !state.colorF||!!itemFamilies(d)[state.colorF];})
      .filter(function(d){return !state.catF||d.category===state.catF;})
      .filter(function(d){return !state.saleOnly||isOnSale(d);})
      .filter(function(d){
        if(!q)return true;
        var parts=[d.name,d.brand,d.notes].concat(d.tags||[]);
        if(d.itemIds){outfitPieces(d).forEach(function(it){if(it)parts.push(it.name);});}
        var hay=parts.filter(Boolean).join(" ").toLowerCase();
        return hay.indexOf(q)>-1;
      });
    var s=state.sort;
    res.sort(function(a,b){
      if(s==="name")return String(a.name||"").localeCompare(String(b.name||""));
      if(s==="old")return (a.createdAt||0)-(b.createdAt||0);
      if(s==="phi"||s==="plo"){
        var pa=priceNum(a.price),pb=priceNum(b.price);
        if(pa==null&&pb==null)return (b.createdAt||0)-(a.createdAt||0);
        if(pa==null)return 1; if(pb==null)return -1;
        return s==="phi"?pb-pa:pa-pb;
      }
      return (b.createdAt||0)-(a.createdAt||0);
    });
    return res;
  }

  function render(){
    var isBrand=state.tab==="brands", isWard=state.tab==="wardrobe", isOut=state.tab==="outfits";
    document.getElementById("cPieces").textContent=state.items.filter(function(i){return i.status!=="bought";}).length;
    document.getElementById("cWardrobe").textContent=state.items.filter(function(i){return i.status==="bought";}).length;
    document.getElementById("cBrands").textContent=state.brands.length;
    document.getElementById("cOutfits").textContent=state.outfits.length;
    [].forEach.call(document.querySelectorAll(".tab"),function(t){t.classList.toggle("on",t.getAttribute("data-tab")===state.tab);});
    document.getElementById("addBtn").textContent=isBrand?"+ Add brand":isWard?"+ Add to wardrobe":isOut?"+ Build outfit":"+ Add piece";
    document.getElementById("search").placeholder=isBrand?"Search brands, tags…":isWard?"Search your wardrobe…":isOut?"Search outfits, pieces…":"Search pieces, brands, tags…";

    var data=baseData(), tags=allTags(data), html="";
    var showColour=(state.tab==="pieces"||state.tab==="wardrobe");

    var sortSel=document.getElementById("sortSel");
    var sortOpts=[["new","Newest"],["old","Oldest"],["name","Name A–Z"]];
    if(showColour){sortOpts.push(["phi","Price high→low"],["plo","Price low→high"]);}
    if(sortOpts.map(function(o){return o[0];}).indexOf(state.sort)<0)state.sort="new";
    sortSel.innerHTML=sortOpts.map(function(o){return '<option value="'+o[0]+'"'+(state.sort===o[0]?" selected":"")+'>'+o[1]+'</option>';}).join("");
    document.getElementById("stats").innerHTML=statsHtml();

    var opts=[];
    if(isBrand){opts.push({key:"all",label:"All",color:"#1B1A17"});for(var k in BRAND_STATUS)opts.push({key:k,label:BRAND_STATUS[k].label,color:BRAND_STATUS[k].color});}
    else if(!isWard&&!isOut){opts=[{key:"all",label:"All",color:"#1B1A17"},{key:"later",label:PIECE_STATUS.later.label,color:PIECE_STATUS.later.color},{key:"want",label:PIECE_STATUS.want.label,color:PIECE_STATUS.want.color}];}
    if(opts.length&&data.length){
      html+='<div class="filt" style="margin-top:12px">';
      opts.forEach(function(o){
        var on=state.statusF===o.key;
        html+='<button class="seg'+(on?" on":"")+'" data-action="status" data-val="'+o.key+'" style="'+(on?("background:"+o.color+";border-color:"+o.color+";"):"")+'">'+esc(o.label)+'</button>';
      });
      html+='</div>';
    }
    if(showColour&&data.length){
      html+='<div class="filt" style="margin-top:10px"><span class="tlabel">type</span>';
      html+='<button class="seg'+(!state.catF?" on":"")+'" data-action="catf" data-val="" style="'+(!state.catF?"background:#1B1A17;border-color:#1B1A17;color:#fff;":"")+'">All</button>';
      CATEGORIES.forEach(function(c){
        var on=state.catF===c[0];
        html+='<button class="seg'+(on?" on":"")+'" data-action="catf" data-val="'+c[0]+'" style="'+(on?"background:#1B1A17;border-color:#1B1A17;color:#fff;":"")+'">'+esc(c[1])+'</button>';
      });
      html+='</div>';
      html+='<div class="filt" style="margin-top:8px"><span class="tlabel">colour</span>';
      html+='<button class="seg'+(!state.colorF?" on":"")+'" data-action="colorf" data-val="" style="'+(!state.colorF?"background:#1B1A17;border-color:#1B1A17;color:#fff;":"")+'">All</button>';
      PALETTE.forEach(function(fam){
        var on=state.colorF===fam.f;
        html+='<button class="seg'+(on?" on":"")+'" data-action="colorf" data-val="'+esc(fam.f)+'" style="'+(on?"background:#1B1A17;border-color:#1B1A17;color:#fff;":"")+'">'+esc(fam.f)+'</button>';
      });
      html+='<button class="seg'+(state.saleOnly?" on":"")+'" data-action="saleonly" style="'+(state.saleOnly?"background:#9A6A12;border-color:#9A6A12;color:#fff;":"")+'">On sale</button>';
      html+='</div>';
    }
    if(tags.length){
      html+='<div class="tagrow"><span class="tlabel">tags</span>';
      tags.forEach(function(t){
        var on=state.tagF===t;
        html+='<button class="chip'+(on?" on":"")+'" data-action="tag" data-val="'+esc(t)+'">'+esc(t)+'</button>';
      });
      html+='</div>';
    }
    var vis=visible();
    if(!vis.length){
      var copy={pieces:["No pieces saved yet.","Add the next thing you want before it vanishes into your saves."],
                wardrobe:["Your wardrobe is empty.","Mark a piece as bought, or add something you already own."],
                outfits:["No outfits yet.","Build a look from pieces in your wardrobe. Populate the wardrobe first if it's empty."],
                brands:["No brands saved yet.","Drop in a brand you like, one with a deal, or one to investigate."]}[state.tab];
      var filtered=data.length>0;
      html+='<div class="empty"><div style="opacity:.35;margin-bottom:12px">'+hanger(40)+'</div>';
      html+='<div class="t">'+(filtered?"Nothing matches that filter.":copy[0])+'</div>';
      html+='<div class="s">'+(filtered?"Clear the search or filter to see everything.":copy[1])+'</div>';
      if(!filtered){html+='<button class="add" data-action="add">'+document.getElementById("addBtn").textContent+'</button>';}
      html+='</div>';
    }else{
      html+='<div class="grid '+(isBrand?"brands":isOut?"outfits":"pieces")+'">';
      vis.forEach(function(d){html+= isBrand?brandCardHtml(d):isOut?outfitCardHtml(d):pieceCardHtml(d,isWard);});
      html+='</div>';
    }
    document.getElementById("content").innerHTML=html;
  }

  function findItem(id){for(var i=0;i<state.items.length;i++)if(state.items[i].id===id)return state.items[i];return null;}
  function setStatus(id,status){var it=findItem(id);if(it){it.status=status;save();render();}}
  function toggleWish(id){var it=findItem(id);if(it){it.status=it.status==="later"?"want":"later";save();render();}}

  function swatchGrid(role,selected){
    var h='<div class="swwrap">';
    if(role==="primary"){h+='<div class="swgrid"><button class="sw clear'+(!selected?" on":"")+'" data-action="pick" data-role="primary" data-hex="" title="No colour">&times;</button></div>';}
    PALETTE.forEach(function(fam){
      h+='<div class="swfam">'+esc(fam.f)+'</div><div class="swgrid">';
      fam.list.forEach(function(c){
        var on = role==="primary" ? selected===c[1] : (selected||[]).indexOf(c[1])>-1;
        h+='<button class="sw'+(on?" on":"")+'" data-action="pick" data-role="'+role+'" data-hex="'+c[1]+'" style="background:'+c[1]+'" title="'+esc(c[0])+'"></button>';
      });
      h+='</div>';
    });
    return h+'</div>';
  }
  function refreshSwatches(){
    var d=modalState.draft;
    [].forEach.call(document.querySelectorAll(".sw"),function(s){
      var role=s.getAttribute("data-role"),hex=s.getAttribute("data-hex");
      var on = role==="primary" ? (d.color||"")===hex : (d.accents||[]).indexOf(hex)>-1;
      s.classList.toggle("on",on);
    });
  }
  function updateClashPreview(){
    var el=document.getElementById("clashPreview");if(!el)return;
    var primaries=(modalState.draft.itemIds||[]).map(findItem).filter(function(it){return it&&it.status==="bought"&&it.color;}).map(function(it){return it.color;});
    el.innerHTML=clashHtml(primaries);
  }

  function openModal(kind,draft){
    modalState={kind:kind,draft:draft};
    var d=draft, h="";
    if(kind==="outfit"){
      h+='<div class="mhead"><h2>'+(d.id?"Edit":"New")+' outfit</h2><button class="x" data-action="close">&times;</button></div>';
      h+='<label class="fl">Name</label><input id="m_name" value="'+esc(d.name||"")+'" placeholder="Sunday layers"/>';
      h+='<label class="fl">Pieces <span style="text-transform:none;letter-spacing:0">(from wardrobe)</span></label>';
      var ward=state.items.filter(function(i){return i.status==="bought";});
      if(!ward.length){h+='<div class="cnote" style="padding:6px 0">Wardrobe is empty — mark some pieces as bought first.</div>';}
      else{
        h+='<div class="pickgrid">';
        ward.forEach(function(it){
          var on=(d.itemIds||[]).indexOf(it.id)>-1;
          h+='<button class="pit'+(on?" on":"")+'" data-action="pickItem" data-id="'+it.id+'">';
          h+='<span class="pitph" style="background:'+esc(it.color||"#EFEBE2")+'">';
          var pimg=photoOf(it);
          if(pimg)h+='<img src="'+esc(pimg)+'" alt="" onerror="this.style.display=\'none\'"/>';
          else if(!it.color)h+=hanger(22);
          h+='</span>';
          h+='<span class="pitn">'+esc(it.name)+'</span></button>';
        });
        h+='</div>';
      }
      h+='<div id="clashPreview" class="clashprev"></div>';
      h+='<label class="fl">Tags <span style="text-transform:none;letter-spacing:0">(season, occasion…)</span></label><input id="m_tags" value="'+esc((d.tags||[]).join(", "))+'" placeholder="summer, work, going out"/>';
      h+='<label class="fl">Notes</label><textarea id="m_notes" rows="2" style="resize:vertical" placeholder="occasion, what makes it work…">'+esc(d.notes||"")+'</textarea>';
      h+='<div class="mfoot">'+(d.id?'<button class="del" data-action="delete">Delete</button>':'<span></span>');
      h+='<div class="mbtns"><button class="cancel" data-action="close">Cancel</button><button class="savebtn" data-action="save">Save</button></div></div>';
      document.getElementById("modal").innerHTML=h;
      document.getElementById("overlay").classList.add("show");
      updateClashPreview();
      var nm=document.getElementById("m_name");if(nm)nm.focus();
      return;
    }
    var isPiece=kind==="piece";
    var smap=isPiece?PIECE_STATUS:BRAND_STATUS;
    h+='<div class="mhead"><h2>'+(d.id?"Edit":"New")+' '+(isPiece?"piece":"brand")+'</h2><button class="x" data-action="close">&times;</button></div>';
    h+='<label class="fl">Name</label><input id="m_name" value="'+esc(d.name||"")+'" placeholder="'+(isPiece?"Wide-leg wool trousers":"Acne Studios")+'"/>';
    if(isPiece){h+='<label class="fl">Brand</label><input id="m_brand" value="'+esc(d.brand||"")+'" placeholder="optional"/>';
      h+='<label class="fl">Category</label><select id="m_cat"><option value="">— none —</option>';
      CATEGORIES.forEach(function(c){h+='<option value="'+c[0]+'"'+(d.category===c[0]?" selected":"")+'>'+esc(c[1])+'</option>';});
      h+='</select>';
      var curPhoto=d.photoData||(d.id?photoCache[d.id]:"")||"";
      h+='<label class="fl">Photo <span style="text-transform:none;letter-spacing:0">(auto-fills colours)</span></label>';
      h+='<div class="photobox'+(curPhoto?" has":"")+'" data-action="takePhoto" id="photoBox">';
      h+= curPhoto?('<img src="'+esc(curPhoto)+'" alt=""/>'):'<span class="photohint"><b>Take or choose a photo</b><br>colours fill in automatically</span>';
      h+='</div>';
      h+='<input type="file" id="m_photo" accept="image/*" capture="environment" hidden />';
      h+='<button class="linkb" id="rmPhoto" data-action="clearPhoto" style="'+(curPhoto?"":"display:none")+'">remove photo</button>';
    }
    h+='<label class="fl">Link</label><input id="m_url" value="'+esc(d.url||"")+'" placeholder="https://…"/>';
    if(isPiece){
      h+='<div class="frow"><div style="flex:1"><label class="fl">Price</label><input id="m_price" value="'+esc(d.price||"")+'" placeholder="€120"/></div>';
      h+='<div style="flex:1"><label class="fl">Was <span style="text-transform:none;letter-spacing:0">(if on sale)</span></label><input id="m_was" value="'+esc(d.wasPrice||"")+'" placeholder="€180"/></div></div>';
      h+='<label class="fl">Image link (optional)</label><input id="m_image" value="'+esc(d.image||"")+'" placeholder="https://…jpg"/>';
      h+='<label class="fl">Primary colour</label>'+swatchGrid("primary",d.color||"");
      h+='<label class="fl">Accent colours (optional)</label>'+swatchGrid("accent",d.accents||[]);
    }
    h+='<label class="fl">Status</label><select id="m_status">';
    for(var k in smap){h+='<option value="'+k+'"'+(d.status===k?" selected":"")+'>'+esc(smap[k].label)+'</option>';}
    h+='</select>';
    h+='<label class="fl">Tags <span style="text-transform:none;letter-spacing:0">(comma-separated)</span></label><input id="m_tags" value="'+esc((d.tags||[]).join(", "))+'" placeholder="winter, formal, sale"/>';
    h+='<label class="fl">Notes</label><textarea id="m_notes" rows="'+(isPiece?2:3)+'" style="resize:vertical" placeholder="'+(isPiece?"size, fit, why you want it…":"quality check, sizing, price tier…")+'">'+esc(d.notes||"")+'</textarea>';
    h+='<div class="mfoot">'+(d.id?'<button class="del" data-action="delete">Delete</button>':'<span></span>');
    h+='<div class="mbtns"><button class="cancel" data-action="close">Cancel</button><button class="savebtn" data-action="save">Save</button></div></div>';
    document.getElementById("modal").innerHTML=h;
    document.getElementById("overlay").classList.add("show");
    var nm=document.getElementById("m_name");if(nm)nm.focus();
  }
  function closeModal(){modalState=null;document.getElementById("overlay").classList.remove("show");document.getElementById("modal").innerHTML="";}
  function clearFilters(){
    state.statusF="all";state.tagF=null;state.colorF=null;state.catF=null;state.saleOnly=false;state.search="";
    var si=document.getElementById("search");if(si)si.value="";
  }
  function saveModal(){
    if(!modalState)return;
    var kind=modalState.kind, d=modalState.draft, creating=!(d&&d.id);
    if(kind==="outfit"){
      var oname=document.getElementById("m_name").value.trim()||"Untitled outfit";
      var otags=document.getElementById("m_tags").value.split(",").map(function(t){return t.trim().toLowerCase();}).filter(Boolean);
      var outag=[];otags.forEach(function(t){if(outag.indexOf(t)<0)outag.push(t);});
      var o={id:d.id,createdAt:d.createdAt,name:oname,tags:outag,notes:document.getElementById("m_notes").value.trim(),
             itemIds:(d.itemIds||[]).slice(),clashOk:d.clashOk||null};
      if(o.id){for(var q=0;q<state.outfits.length;q++)if(state.outfits[q].id===o.id){state.outfits[q]=o;break;}}
      else{o.id=uid();o.createdAt=Date.now();state.outfits.unshift(o);}
      save();closeModal();if(creating)clearFilters();render();return;
    }
    var isPiece=kind==="piece";
    var name=document.getElementById("m_name").value.trim();
    if(!name)return;
    var tags=document.getElementById("m_tags").value.split(",").map(function(t){return t.trim().toLowerCase();}).filter(Boolean);
    var uniq=[];tags.forEach(function(t){if(uniq.indexOf(t)<0)uniq.push(t);});
    var obj={
      id:d.id,createdAt:d.createdAt,name:name,
      url:document.getElementById("m_url").value.trim(),
      status:document.getElementById("m_status").value,
      tags:uniq,notes:document.getElementById("m_notes").value.trim()
    };
    if(isPiece){
      obj.brand=document.getElementById("m_brand").value.trim();
      obj.category=document.getElementById("m_cat").value;
      obj.price=document.getElementById("m_price").value.trim();
      obj.wasPrice=document.getElementById("m_was").value.trim();
      obj.image=document.getElementById("m_image").value.trim();
      obj.color=d.color||"";
      obj.accents=(d.accents||[]).slice();
    }
    var list=isPiece?state.items:state.brands;
    if(obj.id){for(var i=0;i<list.length;i++)if(list[i].id===obj.id){list[i]=obj;break;}}
    else{obj.id=uid();obj.createdAt=Date.now();list.unshift(obj);}
    if(isPiece){
      var dr=modalState.draft;
      if(dr.photoData){idbPut(obj.id,dr.photoData);photoCache[obj.id]=dr.photoData;obj.photo=true;}
      else if(dr.photoRemove){idbDel(obj.id);delete photoCache[obj.id];obj.photo=false;}
      else obj.photo=!!dr.photo;
    }
    save();closeModal();if(creating)clearFilters();render();
  }
  function deleteModal(){
    if(!modalState||!modalState.draft.id)return;
    var kind=modalState.kind, id=modalState.draft.id;
    if(kind==="piece"){
      state.items=state.items.filter(function(x){return x.id!==id;});
      state.outfits.forEach(function(o){o.itemIds=(o.itemIds||[]).filter(function(x){return x!==id;});});
      idbDel(id);delete photoCache[id];
    }
    else if(kind==="outfit")state.outfits=state.outfits.filter(function(x){return x.id!==id;});
    else state.brands=state.brands.filter(function(x){return x.id!==id;});
    save();closeModal();render();
  }
  function openNew(){
    if(state.tab==="brands")openModal("brand",{name:"",url:"",tags:[],notes:"",status:"cool"});
    else if(state.tab==="outfits")openModal("outfit",{name:"",tags:[],notes:"",itemIds:[]});
    else openModal("piece",{name:"",brand:"",category:"",url:"",price:"",wasPrice:"",image:"",color:"",accents:[],tags:[],notes:"",status:state.tab==="wardrobe"?"bought":"later"});
  }
  function openEdit(id){
    if(state.tab==="brands"){var b=null;state.brands.forEach(function(x){if(x.id===id)b=x;});if(b)openModal("brand",JSON.parse(JSON.stringify(b)));}
    else{var it=findItem(id);if(it)openModal("piece",JSON.parse(JSON.stringify(it)));}
  }
  function openEditOutfit(id){var o=findOutfit(id);if(o)openModal("outfit",JSON.parse(JSON.stringify(o)));}

  function exportData(){
    var blob=new Blob([JSON.stringify({items:state.items,brands:state.brands,outfits:state.outfits,photos:photoCache,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="rack-backup.json";a.click();URL.revokeObjectURL(url);
  }
  function importData(file){
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!data||(!Array.isArray(data.items)&&!Array.isArray(data.brands)))throw 0;
        if(!confirm("Replace everything currently in rack with this backup?"))return;
        state.items=Array.isArray(data.items)?data.items:[];
        state.brands=Array.isArray(data.brands)?data.brands:[];
        state.outfits=Array.isArray(data.outfits)?data.outfits:[];
        var photos=(data.photos&&typeof data.photos==="object")?data.photos:{};
        photoCache={};Object.keys(photos).forEach(function(id){photoCache[id]=photos[id];});
        idbClear(function(){Object.keys(photos).forEach(function(id){idbPut(id,photos[id]);});});
        save();render();
      }catch(e){alert("That file isn't a valid rack backup.");}
    };
    r.readAsText(file);
  }

  function bookmarkletHref(){
    var base=location.href.split("#")[0].replace(/'/g,"%27");
    var code="(function(){function m(p){var l=document.getElementsByTagName('meta');for(var i=0;i<l.length;i++){var e=l[i];if(e.getAttribute('property')===p||e.getAttribute('name')===p)return e.content||'';}return '';}var d={name:m('og:title')||document.title||'',image:m('og:image')||'',price:m('og:price:amount')||m('product:price:amount')||'',brand:m('og:site_name')||'',url:location.href};if(!d.image){var b=null,a=document.images;for(var j=0;j<a.length;j++){if(a[j].naturalWidth>200&&(!b||a[j].naturalWidth*a[j].naturalHeight>b.naturalWidth*b.naturalHeight))b=a[j];}if(b)d.image=b.src;}var p=btoa(unescape(encodeURIComponent(JSON.stringify(d))));try{navigator.clipboard.writeText(JSON.stringify(d));}catch(e){}window.open('"+base+"#cap='+p,'rack');})();";
    return "javascript:"+code;
  }
  function openCapture(){
    modalState={kind:"capture",draft:{}};
    var h='<div class="mhead"><h2>Quick capture</h2><button class="x" data-action="close">&times;</button></div>';
    h+='<p class="cnote" style="line-height:1.5;margin:0 0 8px">Drag this to your bookmarks bar, then click it on any product page — it sends the item straight here.</p>';
    h+='<a id="bmk" class="add cap-a">&#43; Save to rack</a>';
    h+='<p class="cnote" style="line-height:1.5;margin:14px 0 0">If your browser blocks the pop-up, the item is also copied to your clipboard — paste it below.</p>';
    h+='<label class="fl">Paste a product URL or copied capture data</label>';
    h+='<textarea id="cap_in" rows="3" style="resize:vertical" placeholder="https://…   or   {captured data}"></textarea>';
    h+='<div class="mfoot"><span></span><div class="mbtns"><button class="cancel" data-action="close">Close</button><button class="savebtn" data-action="prefillCapture">Prefill</button></div></div>';
    document.getElementById("modal").innerHTML=h;
    document.getElementById("overlay").classList.add("show");
    document.getElementById("bmk").href=bookmarkletHref();
  }
  function applyCapture(d){
    if(!d||typeof d!=="object")return;
    state.tab="pieces";state.statusF="all";state.tagF=null;state.colorF=null;state.saleOnly=false;
    document.getElementById("search").value="";state.search="";render();
    openModal("piece",{name:d.name||"",brand:d.brand||"",category:"",url:d.url||"",price:d.price!=null?String(d.price):"",wasPrice:"",image:d.image||"",color:"",accents:[],tags:[],notes:"",status:"later"});
  }
  function prefillCapture(){
    var v=(document.getElementById("cap_in").value||"").trim();
    if(!v){closeModal();return;}
    var d=null;
    if(v.charAt(0)==="{"){try{d=JSON.parse(v);}catch(e){d=null;}}
    if(!d)d=/^https?:\/\//i.test(v)?{url:v}:{name:v};
    closeModal();applyCapture(d);
  }
  function checkHash(){
    var h=location.hash||"";
    if(h.indexOf("#cap=")!==0)return;
    var d=null;
    try{d=JSON.parse(decodeURIComponent(escape(atob(h.slice(5)))));}catch(e){d=null;}
    try{if(history&&history.replaceState)history.replaceState(null,"",location.pathname+location.search);else location.hash="";}catch(e){}
    if(d)applyCapture(d);
  }

  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab");if(!b)return;
    state.tab=b.getAttribute("data-tab");
    state.statusF="all";state.tagF=null;state.colorF=null;state.catF=null;state.saleOnly=false;state.sort="new";state.search="";
    document.getElementById("search").value="";render();
  });
  document.getElementById("search").addEventListener("input",function(e){state.search=e.target.value;render();});
  document.getElementById("sortSel").addEventListener("change",function(e){state.sort=e.target.value;render();});
  document.getElementById("captureBtn").addEventListener("click",openCapture);
  document.getElementById("addBtn").addEventListener("click",openNew);
  document.getElementById("exportBtn").addEventListener("click",exportData);
  document.getElementById("importBtn").addEventListener("click",function(){document.getElementById("importFile").click();});
  document.getElementById("importFile").addEventListener("change",function(e){if(e.target.files[0])importData(e.target.files[0]);e.target.value="";});

  document.getElementById("content").addEventListener("click",function(e){
    var b=e.target.closest("[data-action]");if(!b)return;
    var act=b.getAttribute("data-action"),id=b.getAttribute("data-id"),val=b.getAttribute("data-val");
    if(act==="edit")openEdit(id);
    else if(act==="bought")setStatus(id,"bought");
    else if(act==="relist")setStatus(id,"later");
    else if(act==="toggle")toggleWish(id);
    else if(act==="status"){state.statusF=val;render();}
    else if(act==="tag"){state.tagF=state.tagF===val?null:val;render();}
    else if(act==="colorf"){state.colorF=val?(state.colorF===val?null:val):null;render();}
    else if(act==="catf"){state.catF=val?(state.catF===val?null:val):null;render();}
    else if(act==="saleonly"){state.saleOnly=!state.saleOnly;render();}
    else if(act==="add")openNew();
    else if(act==="editOutfit")openEditOutfit(id);
    else if(act==="dismissClash"){var o=findOutfit(id);if(o){o.clashOk=clashSig(o);save();render();}}
    else if(act==="undoClash"){var o2=findOutfit(id);if(o2){o2.clashOk=null;save();render();}}
  });

  var overlay=document.getElementById("overlay");
  overlay.addEventListener("mousedown",function(e){if(e.target===overlay)closeModal();});
  document.getElementById("modal").addEventListener("click",function(e){
    var b=e.target.closest("[data-action]");if(!b)return;
    var act=b.getAttribute("data-action");
    if(act==="close")closeModal();
    else if(act==="save")saveModal();
    else if(act==="delete")deleteModal();
    else if(act==="prefillCapture")prefillCapture();
    else if(act==="takePhoto"){var fi=document.getElementById("m_photo");if(fi)fi.click();}
    else if(act==="clearPhoto"){
      var dr=modalState.draft;dr.photoData=null;
      if(dr.id&&photoCache[dr.id])dr.photoRemove=true;
      var pb=document.getElementById("photoBox");if(pb){pb.classList.remove("has");pb.innerHTML='<span class="photohint"><b>Take or choose a photo</b><br>colours fill in automatically</span>';}
      var rm=document.getElementById("rmPhoto");if(rm)rm.style.display="none";
    }
    else if(act==="pick"){
      var role=b.getAttribute("data-role"),hex=b.getAttribute("data-hex"),d=modalState.draft;
      if(role==="primary"){d.color=(d.color===hex)?"":hex;}
      else{d.accents=d.accents||[];var ix=d.accents.indexOf(hex);if(ix>-1)d.accents.splice(ix,1);else d.accents.push(hex);}
      refreshSwatches();
    }
    else if(act==="pickItem"){
      var pid=b.getAttribute("data-id"),dd=modalState.draft;dd.itemIds=dd.itemIds||[];
      var j=dd.itemIds.indexOf(pid);if(j>-1)dd.itemIds.splice(j,1);else dd.itemIds.push(pid);
      b.classList.toggle("on");updateClashPreview();
    }
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&modalState)closeModal();});
  document.getElementById("modal").addEventListener("change",function(e){
    if(e.target&&e.target.id==="m_photo"&&e.target.files&&e.target.files[0]){
      var pb=document.getElementById("photoBox");
      if(pb){pb.classList.remove("has");pb.innerHTML='<span class="photohint">reading photo…</span>';}
      processPhotoFile(e.target.files[0],function(durl,pal){
        if(!modalState)return;
        if(!durl){if(pb)pb.innerHTML='<span class="photohint">could not read that image</span>';return;}
        var dr=modalState.draft;dr.photoData=durl;dr.photoRemove=false;
        if(pal){if(pal.color)dr.color=pal.color;if(pal.accents)dr.accents=pal.accents.slice();}
        if(pb){pb.classList.add("has");pb.innerHTML='<img src="'+durl+'" alt=""/>';}
        var rm=document.getElementById("rmPhoto");if(rm)rm.style.display="";
        refreshSwatches();
      });
      e.target.value="";
    }
  });

  function boot(){ load(); idbAll(function(p){ photoCache=p||{}; render(); checkHash(); }); }
  window.addEventListener("hashchange",checkHash);
  boot();
})();
</script>
</body>
</html>
